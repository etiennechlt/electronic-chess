<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* over the 3D stage of the root: e2-e4 on the board, the square
           answers with its two lights; shades keep the words readable */
        #s10 {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .s10-shade {
          position: absolute;
          left: 0;
          width: 1080px;
        }
        #s10-top {
          top: 0;
          height: 520px;
          background: linear-gradient(rgba(16, 20, 24, 0.94) 70%, rgba(16, 20, 24, 0));
        }
        #s10-bot {
          top: 1100px;
          height: 560px;
          background: linear-gradient(rgba(16, 20, 24, 0), rgba(16, 20, 24, 0.9) 18%, rgba(16, 20, 24, 0.9) 80%, rgba(16, 20, 24, 0));
        }
        #s10-kw {
          position: absolute;
          left: 72px;
          top: 262px;
          width: 888px;
          font-size: 120px;
        }
        #s10-pills {
          position: absolute;
          left: 72px;
          top: 1170px;
          width: 888px;
          display: flex;
          justify-content: center;
          gap: 18px;
        }
        .s10-pill {
          font-size: 30px;
          padding: 10px 24px;
          border: 2px solid rgba(244, 239, 230, 0.45);
          border-radius: 99px;
          color: var(--blanc);
          white-space: nowrap;
        }
      </style>

      <div id="s10" data-composition-id="s10-arbitre" data-width="1080" data-height="1920">
        <div id="s10-top" class="s10-shade"></div>
        <div id="s10-bot" class="s10-shade"></div>
        <p id="s10-kw" class="kw">Arbitre</p>
        <div id="s10-pills">
          <p class="mono s10-pill">roque</p>
          <p class="mono s10-pill">prise en passant</p>
          <p class="mono s10-pill">promotion</p>
        </div>
      </div>

      <script>
        (function () {
          const root = document.getElementById("s10");
          window.fillFacts(root);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s10-kw", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, 0.05);
          // e2-e4 runs from 0.45 to 0.9 s in the root 3D scene, the square lights at 0.9 s
          gsap.utils.toArray(".s10-pill").forEach(function (pill, i) {
            tl.fromTo(pill, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2)" }, 1.4 + i * 0.18);
          });
          window.__timelines["s10-arbitre"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
