<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* over the 3D stage of the root: the carriage base open, then the
           board module comes down into it, same camera */
        #s13 {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #s13-kw {
          position: absolute;
          left: 72px;
          top: 262px;
          width: 888px;
          font-size: 120px;
        }
        #s13-sub {
          position: absolute;
          left: 72px;
          top: 392px;
          width: 888px;
          font-size: 30px;
          color: var(--gris);
        }
        #s13-sub b {
          font-weight: 500;
          color: var(--cuivre);
        }
      </style>

      <div id="s13" data-composition-id="s13-chariot" data-width="1080" data-height="1920">
        <p id="s13-kw" class="kw">En option</p>
        <p id="s13-sub" class="mono">portique CoreXY · aimant néodyme · <b>phase 2</b></p>
      </div>

      <script>
        (function () {
          const root = document.getElementById("s13");
          window.fillFacts(root);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s13-kw", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, 0.05);
          tl.fromTo("#s13-sub", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.3);
          // the module lands in the base at 1.7 s (root 3D scene, with its thud)
          window.__timelines["s13-chariot"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
