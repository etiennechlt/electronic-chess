<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s11 {
          position: absolute;
          inset: 0;
          background: var(--nuit);
          overflow: hidden;
        }
        #s11-kw {
          position: absolute;
          left: 72px;
          top: 262px;
          width: 888px;
          font-size: 120px;
        }
        #s11-render {
          position: absolute;
          left: 170px;
          top: 450px;
          width: 780px;
          height: 780px;
        }
        #s11-board {
          position: absolute;
          left: 72px;
          top: 470px;
          width: 120px;
          height: 80px;
        }
        #s11-link {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
        }
        #s11-link svg {
          width: 1080px;
          height: 1920px;
        }
        #s11-radio {
          position: absolute;
          left: 72px;
          top: 572px;
          font-size: 30px;
          color: var(--cyan);
          white-space: nowrap;
        }
        #s11-pills {
          position: absolute;
          left: 72px;
          top: 1170px;
          width: 888px;
          display: flex;
          justify-content: center;
          gap: 18px;
        }
        .s11-pill {
          font-size: 30px;
          padding: 10px 24px;
          border: 2px solid rgba(244, 239, 230, 0.45);
          border-radius: 99px;
          color: var(--blanc);
          white-space: nowrap;
        }
      </style>

      <div id="s11" data-composition-id="s11-horloge" data-width="1080" data-height="1920">
        <p id="s11-kw" class="kw">Sans fil</p>
        <img id="s11-render" src="assets/rendus/horloge.png" alt="" />
        <svg id="s11-board" viewBox="0 0 120 80" aria-hidden="true">
          <rect x="0" y="0" width="40" height="40" fill="#d9b98c" />
          <rect x="40" y="0" width="40" height="40" fill="#6b4321" />
          <rect x="80" y="0" width="40" height="40" fill="#d9b98c" />
          <rect x="0" y="40" width="40" height="40" fill="#6b4321" />
          <rect x="40" y="40" width="40" height="40" fill="#d9b98c" />
          <rect x="80" y="40" width="40" height="40" fill="#6b4321" />
        </svg>
        <div id="s11-link">
          <svg viewBox="0 0 1080 1920" aria-hidden="true">
            <path d="M200 500 C 330 400, 470 420, 560 610" fill="none" stroke="#2ec4b6" stroke-width="5" stroke-dasharray="14 12" stroke-linecap="round" />
          </svg>
        </div>
        <p id="s11-radio" class="mono"><span data-fact="radio"></span> · <span data-fact="clock_mcu"></span></p>
        <div id="s11-pills">
          <p class="mono s11-pill">moteur sur Pi</p>
          <p class="mono s11-pill">partie en ligne</p>
        </div>
      </div>

      <script>
        (function () {
          const root = document.getElementById("s11");
          window.fillFacts(root);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s11-kw", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, 0.05);
          tl.fromTo("#s11-render", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.1);
          // the board talks to its clock: the radio link draws from left to right
          tl.fromTo("#s11-link", { clipPath: "inset(0px 880px 0px 200px)" }, { clipPath: "inset(0px 520px 0px 200px)", duration: 0.7, ease: "power1.inOut" }, 0.35);
          tl.fromTo("#s11-radio", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.8);
          gsap.utils.toArray(".s11-pill").forEach(function (pill, i) {
            tl.fromTo(pill, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2)" }, 1.3 + i * 0.2);
          });
          window.__timelines["s11-horloge"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
