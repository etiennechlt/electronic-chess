<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* over the 3D stage of the root: the clock beside the board, its bar
           rocking at each move; shades keep the words readable */
        #s11 {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .s11-shade {
          position: absolute;
          left: 0;
          width: 1080px;
        }
        #s11-top {
          top: 0;
          height: 640px;
          background: linear-gradient(rgba(16, 20, 24, 0.94) 75%, rgba(16, 20, 24, 0));
        }
        #s11-bot {
          top: 1100px;
          height: 560px;
          background: linear-gradient(rgba(16, 20, 24, 0), rgba(16, 20, 24, 0.9) 18%, rgba(16, 20, 24, 0.9) 80%, rgba(16, 20, 24, 0));
        }
        #s11-kw {
          position: absolute;
          left: 72px;
          top: 262px;
          width: 888px;
          font-size: 120px;
        }
        #s11-radio {
          position: absolute;
          left: 72px;
          top: 400px;
          display: flex;
          align-items: center;
          gap: 16px;
          font-size: 34px;
          color: var(--cyan);
          white-space: nowrap;
        }
        #s11-radio svg {
          width: 46px;
          height: 34px;
        }
        #s11-pills {
          position: absolute;
          left: 72px;
          top: 1170px;
          width: 888px;
          display: flex;
          justify-content: center;
          gap: 18px;
        }
        .s11-pill {
          font-size: 30px;
          padding: 10px 24px;
          border: 2px solid rgba(244, 239, 230, 0.45);
          border-radius: 99px;
          color: var(--blanc);
          white-space: nowrap;
        }
      </style>

      <div id="s11" data-composition-id="s11-horloge" data-width="1080" data-height="1920">
        <div id="s11-top" class="s11-shade"></div>
        <div id="s11-bot" class="s11-shade"></div>
        <p id="s11-kw" class="kw">Sans fil</p>
        <p id="s11-radio" class="mono">
          <svg viewBox="0 0 46 34" aria-hidden="true">
            <path class="s11-wave" d="M6 26 A 20 20 0 0 1 6 8" fill="none" stroke="#2ec4b6" stroke-width="4" stroke-linecap="round" />
            <path class="s11-wave" d="M16 21 A 9 9 0 0 1 16 13" fill="none" stroke="#2ec4b6" stroke-width="4" stroke-linecap="round" />
            <circle cx="27" cy="17" r="4" fill="#2ec4b6" />
          </svg>
          <span><span data-fact="radio"></span> · <span data-fact="clock_mcu"></span></span>
        </p>
        <div id="s11-pills">
          <p class="mono s11-pill">moteur sur Pi</p>
          <p class="mono s11-pill">partie en ligne</p>
        </div>
      </div>

      <script>
        (function () {
          const root = document.getElementById("s11");
          window.fillFacts(root);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s11-kw", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, 0.05);
          tl.fromTo("#s11-radio", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.5);
          // the radio pulses each time the bar rocks (0.7 and 2.1 s, root 3D scene)
          [0.7, 2.1].forEach(function (t) {
            tl.fromTo(".s11-wave", { opacity: 0.25 }, { opacity: 1, duration: 0.25, stagger: 0.08, ease: "power1.out" }, t);
          });
          gsap.utils.toArray(".s11-pill").forEach(function (pill, i) {
            tl.fromTo(pill, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2)" }, 1.3 + i * 0.2);
          });
          window.__timelines["s11-horloge"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
