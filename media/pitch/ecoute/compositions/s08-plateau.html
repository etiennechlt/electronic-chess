<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* over the 3D stage of the root: the board and its pieces, slow push;
           scene 09 starts from the same camera */
        #s08 {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .s08-dim {
          position: absolute;
          left: 72px;
          width: 888px;
          display: flex;
          align-items: baseline;
          gap: 22px;
        }
        .s08-dim .kw {
          font-size: 160px;
        }
        .s08-dim .mono {
          font-size: 36px;
          color: var(--blanc);
        }
        #s08-side { top: 250px; }
        #s08-thick { top: 430px; }
        #s08-thick .kw { color: var(--cuivre); }
      </style>

      <div id="s08" data-composition-id="s08-plateau" data-width="1080" data-height="1920">
        <div id="s08-side" class="s08-dim">
          <p class="kw"><span data-fact="module_cm"></span> cm</p>
          <p class="mono">de côté</p>
        </div>
        <div id="s08-thick" class="s08-dim">
          <p class="kw"><span data-fact="thickness_mm"></span> mm</p>
          <p class="mono">d'épaisseur</p>
        </div>
      </div>

      <script>
        (function () {
          const root = document.getElementById("s08");
          window.fillFacts(root);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s08-side", { opacity: 0, scale: 1.12, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out", transformOrigin: "0% 50%" }, 0.15);
          tl.fromTo("#s08-thick", { opacity: 0, scale: 1.12, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out", transformOrigin: "0% 50%" }, 0.85);
          window.__timelines["s08-plateau"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
