<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s05 {
          position: absolute;
          inset: 0;
          background: var(--nuit);
          overflow: hidden;
        }
        #s05-kw {
          position: absolute;
          left: 72px;
          top: 262px;
          width: 888px;
          font-size: 130px;
        }
        #s05-scope {
          position: absolute;
          left: 72px;
          top: 470px;
          width: 888px;
          height: 680px;
          overflow: visible;
        }
        .s05-label {
          position: absolute;
          font-size: 32px;
          white-space: nowrap;
        }
        #s05-l-pulse { left: 72px; top: 1160px; color: var(--cuivre); }
        #s05-l-tau { left: 560px; top: 610px; color: var(--blanc); }
        #s05-l-window { left: 560px; top: 1160px; color: var(--gris); }
      </style>

      <div id="s05" data-composition-id="s05-frappe" data-width="1080" data-height="1920">
        <p id="s05-kw" class="kw">Frappe</p>
        <svg id="s05-scope" viewBox="0 0 888 680" aria-hidden="true">
          <line x1="0" y1="340" x2="888" y2="340" stroke="#8a97a3" stroke-width="2" opacity="0.5" />
          <rect id="s05-pulse" x="2" y="30" width="12" height="310" fill="#b87333" />
          <path id="s05-env-hi" fill="none" stroke="#f4efe6" stroke-width="2" stroke-dasharray="8 10" opacity="0.45" />
          <path id="s05-env-lo" fill="none" stroke="#f4efe6" stroke-width="2" stroke-dasharray="8 10" opacity="0.45" />
          <path id="s05-wave" fill="none" stroke="#2ec4b6" stroke-width="5" stroke-linejoin="round" />
        </svg>
        <p id="s05-l-pulse" class="mono s05-label">▲ excitation <span data-fact="pulse_us"></span> µs</p>
        <p id="s05-l-tau" class="mono s05-label">τ = <span data-fact="tau_us"></span> µs</p>
        <p id="s05-l-window" class="mono s05-label">écoute <span data-fact="window_us"></span> µs</p>
      </div>

      <script>
        (function () {
          const root = document.getElementById("s05");
          window.fillFacts(root);
          const F = window.FACTS;
          // the black pawn's own ringdown over the listening window
          const spanUs = Number(F.window_us);
          const cycles = F.line["pawn-black"].khz * 1e3 * spanUs * 1e-6;
          const decay = spanUs / Number(F.tau_us);
          const wave = document.getElementById("s05-wave");
          wave.setAttribute("d", window.FILM.ringdownPath(30, 888, 340, 300, cycles, decay, 1600));
          document.getElementById("s05-env-hi").setAttribute("d", window.FILM.envelopePath(30, 888, 340, 300, decay, 1));
          document.getElementById("s05-env-lo").setAttribute("d", window.FILM.envelopePath(30, 888, 340, 300, decay, -1));
          const len = window.FILM.dashReady(wave);

          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s05-kw", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, 0.05);
          // the strike, then the piece rings (its note plays at 0.3 s)
          tl.fromTo("#s05-pulse", { scaleY: 0, svgOrigin: "8 340" }, { scaleY: 1, duration: 0.1, ease: "power4.out", svgOrigin: "8 340" }, 0.2);
          tl.fromTo("#s05-l-pulse", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.25);
          tl.fromTo(wave, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1.3, ease: "none" }, 0.3);
          tl.fromTo(["#s05-env-hi", "#s05-env-lo"], { opacity: 0 }, { opacity: 0.45, duration: 0.4 }, 1.4);
          tl.fromTo("#s05-l-tau", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 1.55);
          tl.fromTo("#s05-l-window", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.75);
          window.__timelines["s05-frappe"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
