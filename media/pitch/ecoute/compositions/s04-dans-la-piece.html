<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* over the 3D stage of the root: the piece opens on the studio floor
           there, and its labels follow the parts (#labels in index.html) */
        #s04 {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #s04-kw {
          position: absolute;
          left: 72px;
          top: 262px;
          width: 888px;
          font-size: 100px;
        }
      </style>

      <div id="s04" data-composition-id="s04-dans-la-piece" data-width="1080" data-height="1920">
        <p id="s04-kw" class="kw">Rien d'actif</p>
      </div>

      <script>
        (function () {
          const root = document.getElementById("s04");
          window.fillFacts(root);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s04-kw", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, 0.1);
          window.__timelines["s04-dans-la-piece"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
