<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s07 {
          position: absolute;
          inset: 0;
          background: var(--nuit);
          overflow: hidden;
        }
        #s07-kw {
          position: absolute;
          left: 72px;
          top: 262px;
          width: 888px;
          display: flex;
          align-items: center;
          gap: 26px;
        }
        #s07-name {
          font-size: 84px;
          white-space: nowrap;
        }
        #s07-check {
          width: 92px;
          height: 92px;
          flex: none;
        }
        #s07-axis {
          position: absolute;
          left: 72px;
          top: 440px;
          width: 888px;
          height: 840px;
          overflow: visible;
        }
        #s07-axis text {
          dominant-baseline: middle;
        }
        .s07-name {
          font-weight: 600;
          font-size: 30px;
        }
        .s07-khz {
          font-family: "IBM Plex Mono", monospace;
          font-size: 27px;
        }
      </style>

      <div id="s07" data-composition-id="s07-identifiee" data-width="1080" data-height="1920">
        <div id="s07-kw">
          <p id="s07-name" class="kw" data-fact="line.queen-white.name"></p>
          <svg id="s07-check" viewBox="0 0 92 92" aria-hidden="true">
            <path id="s07-tick" d="M14 48 L38 72 L80 22" fill="none" stroke="#2ec4b6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <svg id="s07-axis" viewBox="0 0 888 840" aria-hidden="true">
          <line x1="280" y1="10" x2="280" y2="830" stroke="#8a97a3" stroke-width="2" opacity="0.4" />
          <g id="s07-rows"></g>
          <path id="s07-spectrum" fill="none" stroke="#2ec4b6" stroke-width="4" stroke-linejoin="round" />
        </svg>
      </div>

      <script>
        (function () {
          const root = document.getElementById("s07");
          window.fillFacts(root);
          const F = window.FACTS;
          const NS = "http://www.w3.org/2000/svg";
          const color = { black: "#ffb347", white: "#f4efe6" };
          const target = F.line["queen-white"];
          const rowsG = document.getElementById("s07-rows");
          let hit = null;
          // the twelve lines of scene 06, dimmed: the spectrum has to fall on one
          F.lines.forEach(function (line) {
            const y = window.FILM.freqY(line.khz);
            const g = document.createElementNS(NS, "g");
            g.setAttribute("opacity", "0.22");
            g.innerHTML =
              '<rect x="296" y="' + (y - 9) + '" width="320" height="18" rx="3" fill="' + color[line.color] + '"/>' +
              '<text class="sans s07-name" x="262" y="' + y + '" text-anchor="end" fill="' + color[line.color] + '"></text>' +
              '<text class="s07-khz" x="636" y="' + y + '" fill="#8a97a3"></text>';
            g.children[1].textContent = line.name;
            g.children[2].textContent = line.label;
            rowsG.appendChild(g);
            if (line.slug === target.slug) {
              g.setAttribute("id", "s07-hit");
              hit = g;
            }
          });
          // a measured spectrum: low floor, one line standing out at the piece's frequency
          const yHit = window.FILM.freqY(target.khz);
          let d = "";
          for (let y = 10; y <= 830; y += 2) {
            const floor = 7 + 4 * Math.sin(y * 0.37) * Math.sin(y * 0.051) + 2.5 * Math.sin(y * 0.83);
            const peak = 312 / (1 + Math.pow((y - yHit) / 14, 2));
            d += (y === 10 ? "M" : " L") + (288 + floor + peak).toFixed(1) + " " + y;
          }
          const spectrum = document.getElementById("s07-spectrum");
          spectrum.setAttribute("d", d);
          const len = window.FILM.dashReady(spectrum);

          const tl = gsap.timeline({ paused: true });
          tl.fromTo(spectrum, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1.0, ease: "power1.inOut" }, 0.15);
          // nearest neighbour: the line under the peak lights up (its note plays at 1.35 s)
          tl.fromTo(hit, { opacity: 0.22 }, { opacity: 1, duration: 0.2 }, 1.3);
          tl.fromTo("#s07-name", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, 1.35);
          tl.fromTo("#s07-tick", { strokeDasharray: "120 120", strokeDashoffset: 120 }, { strokeDasharray: "120 120", strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, 1.5);
          window.__timelines["s07-identifiee"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
