<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s01 {
          position: absolute;
          inset: 0;
          background: var(--nuit);
          overflow: hidden;
        }
        #s01-shadow {
          position: absolute;
          left: 356px;
          top: 800px;
          width: 320px;
          height: 56px;
          border-radius: 50%;
          background: rgba(0, 0, 0, 0.55);
          filter: blur(10px);
        }
        #s01-puck {
          position: absolute;
          left: 366px;
          top: 480px;
          width: 300px;
          height: 360px;
        }
        #s01-lines {
          position: absolute;
          left: 72px;
          top: 900px;
          width: 888px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
        }
        .s01-line {
          display: block;
          font-size: 100px;
        }
        .s01-zero {
          color: var(--cuivre);
          font-weight: 500;
        }
      </style>

      <div id="s01" data-composition-id="s01-piece" data-width="1080" data-height="1920">
        <div id="s01-shadow"></div>
        <svg id="s01-puck" viewBox="0 0 300 360" aria-hidden="true">
          <ellipse cx="150" cy="300" rx="140" ry="44" fill="#2e4256" />
          <rect x="10" y="90" width="280" height="210" fill="#5b82a6" />
          <ellipse cx="150" cy="300" rx="140" ry="44" fill="#4e7393" />
          <rect x="10" y="90" width="280" height="210" fill="#5b82a6" />
          <ellipse cx="150" cy="90" rx="140" ry="44" fill="#7fa3c4" />
          <ellipse cx="150" cy="90" rx="104" ry="30" fill="#8db0cf" />
        </svg>
        <div id="s01-lines">
          <p class="kw s01-line"><span class="mono s01-zero">0</span> PUCE</p>
          <p class="kw s01-line"><span class="mono s01-zero">0</span> PILE</p>
          <p class="kw s01-line"><span class="mono s01-zero">0</span> CONTACT</p>
        </div>
      </div>

      <script>
        (function () {
          const root = document.getElementById("s01");
          window.fillFacts(root);
          const tl = gsap.timeline({ paused: true });
          // the piece drops in and lands (0.1 to 0.45 s)
          tl.fromTo("#s01-puck", { y: -900 }, { y: 0, duration: 0.35, ease: "power3.in" }, 0.1);
          tl.fromTo("#s01-shadow", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.in" }, 0.1);
          tl.fromTo("#s01-puck", { scaleY: 0.94 }, { scaleY: 1, duration: 0.18, ease: "back.out(3)", transformOrigin: "50% 100%", immediateRender: false }, 0.45);
          // the three zeros, one after the other: the hook holds without sound
          gsap.utils.toArray(".s01-line").forEach(function (line, i) {
            tl.fromTo(line, { opacity: 0, scale: 1.18 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, 0.75 + i * 0.4);
          });
          window.__timelines["s01-piece"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
