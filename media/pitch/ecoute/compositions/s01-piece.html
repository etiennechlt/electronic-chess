<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* over the 3D stage of the root: the pawn drops onto the studio floor there */
        #s01 {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #s01-lines {
          position: absolute;
          left: 72px;
          top: 900px;
          width: 888px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
        }
        .s01-line {
          display: block;
          font-size: 100px;
        }
        .s01-zero {
          color: var(--cuivre);
          font-weight: 500;
        }
      </style>

      <div id="s01" data-composition-id="s01-piece" data-width="1080" data-height="1920">
        <div id="s01-lines">
          <p class="kw s01-line"><span class="mono s01-zero">0</span> PUCE</p>
          <p class="kw s01-line"><span class="mono s01-zero">0</span> PILE</p>
          <p class="kw s01-line"><span class="mono s01-zero">0</span> CONTACT</p>
        </div>
      </div>

      <script>
        (function () {
          const root = document.getElementById("s01");
          window.fillFacts(root);
          const tl = gsap.timeline({ paused: true });
          // the piece lands at 0.45 s in the root 3D scene, then the three zeros
          // come one after the other: the hook holds without sound
          gsap.utils.toArray(".s01-line").forEach(function (line, i) {
            tl.fromTo(line, { opacity: 0, scale: 1.18 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, 0.75 + i * 0.4);
          });
          window.__timelines["s01-piece"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
