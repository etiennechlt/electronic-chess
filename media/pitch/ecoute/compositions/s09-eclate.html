<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* over the 3D stage of the root: same camera as the end of scene 08,
           then the layers come apart and the one named here glows cyan */
        #s09 {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .s09-item {
          position: absolute;
          left: 72px;
          top: 250px;
          width: 888px;
        }
        .s09-item .kw {
          font-size: 100px;
        }
        .s09-item .mono {
          margin-top: 14px;
          font-size: 34px;
          color: var(--blanc);
        }
        .s09-mark {
          display: inline-block;
          width: 72px;
          height: 6px;
          margin-right: 18px;
          border-radius: 3px;
          vertical-align: middle;
          background: var(--cyan);
        }
      </style>

      <div id="s09" data-composition-id="s09-eclate" data-width="1080" data-height="1920">
        <div id="s09-i0" class="s09-item">
          <p class="kw">Contreplaqué</p>
          <p class="mono"><i class="s09-mark"></i><span data-fact="plywood_mm"></span> mm de bois sur les bobines</p>
        </div>
        <div id="s09-i1" class="s09-item">
          <p class="kw"><span data-fact="quadrants"></span> quadrants</p>
          <p class="mono"><i class="s09-mark"></i><span data-fact="quadrant_grid"></span> cases · <span data-fact="coils"></span> spirales · <span data-fact="leds"></span> LED</p>
        </div>
        <div id="s09-i2" class="s09-item">
          <p class="kw">Cerveau</p>
          <p class="mono"><i class="s09-mark"></i><span data-fact="mcu"></span>, il arbitre et il calcule</p>
        </div>
        <div id="s09-i3" class="s09-item">
          <p class="kw">Batterie <span data-fact="battery"></span></p>
          <p class="mono"><i class="s09-mark"></i><span data-fact="energy_wh"></span> Wh en cellules plates</p>
        </div>
      </div>

      <script>
        (function () {
          const root = document.getElementById("s09");
          window.fillFacts(root);
          const tl = gsap.timeline({ paused: true });
          // one keyword at a time, top to bottom of the stack (the 3D layer glows at the same times)
          const at = [1.25, 2.05, 2.85, 3.65];
          at.forEach(function (t, i) {
            tl.fromTo("#s09-i" + i, { opacity: 0, scale: 1.12, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out", transformOrigin: "0% 50%" }, t);
            if (i < at.length - 1) {
              tl.to("#s09-i" + i, { opacity: 0, duration: 0.1 }, at[i + 1] - 0.1);
            }
          });
          window.__timelines["s09-eclate"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
