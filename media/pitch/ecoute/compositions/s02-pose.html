<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s02 {
          position: absolute;
          inset: 0;
          background: var(--nuit);
          overflow: hidden;
        }
        #s02-board {
          position: absolute;
          left: 216px;
          top: 400px;
          width: 600px;
          height: 600px;
          overflow: visible;
        }
        #s02-name {
          position: absolute;
          left: 72px;
          top: 1045px;
          width: 888px;
          text-align: center;
          font-size: 112px;
          color: var(--ambre);
        }
        #s02-freq {
          position: absolute;
          left: 72px;
          top: 1165px;
          width: 888px;
          text-align: center;
          font-size: 54px;
          color: var(--cyan);
        }
      </style>

      <div id="s02" data-composition-id="s02-pose" data-width="1080" data-height="1920">
        <svg id="s02-board" viewBox="0 0 600 600" aria-hidden="true">
          <rect x="0" y="0" width="200" height="200" fill="#d9b98c" />
          <rect x="200" y="0" width="200" height="200" fill="#6b4321" />
          <rect x="400" y="0" width="200" height="200" fill="#d9b98c" />
          <rect x="0" y="200" width="200" height="200" fill="#6b4321" />
          <rect x="200" y="200" width="200" height="200" fill="#d9b98c" />
          <rect x="400" y="200" width="200" height="200" fill="#6b4321" />
          <rect x="0" y="400" width="200" height="200" fill="#d9b98c" />
          <rect x="200" y="400" width="200" height="200" fill="#6b4321" />
          <rect x="400" y="400" width="200" height="200" fill="#d9b98c" />
          <g id="s02-rings" fill="none" stroke="#2ec4b6" stroke-width="5">
            <circle class="s02-ring" cx="300" cy="300" r="96" />
            <circle class="s02-ring" cx="300" cy="300" r="96" />
            <circle class="s02-ring" cx="300" cy="300" r="96" />
          </g>
          <g id="s02-puck">
            <circle cx="300" cy="300" r="80" fill="#141414" stroke="#ffb347" stroke-width="6" />
            <circle cx="300" cy="300" r="58" fill="#1f1f1f" />
          </g>
        </svg>
        <p id="s02-name" class="kw"><span data-fact="line.pawn-black.name"></span></p>
        <p id="s02-freq" class="mono"><span data-fact="line.pawn-black.label"></span></p>
      </div>

      <script>
        (function () {
          const root = document.getElementById("s02");
          window.fillFacts(root);
          const tl = gsap.timeline({ paused: true });
          // the piece comes down onto the square, seen from above
          tl.fromTo("#s02-puck", { scale: 1.7, opacity: 0, svgOrigin: "300 300" }, { scale: 1, opacity: 1, duration: 0.22, ease: "power2.in", svgOrigin: "300 300" }, 0.03);
          // contact: the board listens, rings leave the piece (the note plays at 0.25 s)
          gsap.utils.toArray(".s02-ring").forEach(function (ring, i) {
            tl.fromTo(ring, { scale: 1, opacity: 0.9, svgOrigin: "300 300" }, { scale: 3.3, opacity: 0, duration: 1.3, ease: "power1.out", svgOrigin: "300 300" }, 0.25 + i * 0.28);
          });
          tl.fromTo("#s02-name", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, 0.45);
          tl.fromTo("#s02-freq", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.7);
          window.__timelines["s02-pose"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
