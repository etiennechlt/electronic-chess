<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* over the 3D stage of the root: the pawn set on e4, its rings, the square lit */
        #s02 {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #s02-shade {
          position: absolute;
          left: 0;
          top: 960px;
          width: 1080px;
          height: 520px;
          background: linear-gradient(rgba(16, 20, 24, 0), rgba(16, 20, 24, 0.9) 22%, rgba(16, 20, 24, 0.9) 80%, rgba(16, 20, 24, 0));
        }
        #s02-name {
          position: absolute;
          left: 72px;
          top: 1045px;
          width: 888px;
          text-align: center;
          font-size: 112px;
          color: var(--ambre);
        }
        #s02-freq {
          position: absolute;
          left: 72px;
          top: 1165px;
          width: 888px;
          text-align: center;
          font-size: 54px;
          color: var(--cyan);
        }
      </style>

      <div id="s02" data-composition-id="s02-pose" data-width="1080" data-height="1920">
        <div id="s02-shade"></div>
        <p id="s02-name" class="kw"><span data-fact="line.pawn-black.name"></span></p>
        <p id="s02-freq" class="mono"><span data-fact="line.pawn-black.label"></span></p>
      </div>

      <script>
        (function () {
          const root = document.getElementById("s02");
          window.fillFacts(root);
          const tl = gsap.timeline({ paused: true });
          // the piece lands at 0.25 s and the note plays (root 3D scene), then its name
          tl.fromTo("#s02-shade", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.2);
          tl.fromTo("#s02-name", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, 0.45);
          tl.fromTo("#s02-freq", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.7);
          window.__timelines["s02-pose"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
