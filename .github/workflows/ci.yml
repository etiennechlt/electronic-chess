name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (corridor constraint gates the build)
        run: pytest -q
      - name: Report smoke test
        run: python -m chessboard_calc report --pitch all > /dev/null

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build mockup firmware
        run: make -C firmware/mockup
      - name: Build brain firmware
        run: make -C firmware/board
      - name: Host test of the clock logic
        run: |
          cc -Wall -Wextra -Werror -Ifirmware/esp32/clock/main \
            firmware/esp32/clock/test/test_chessclock.c firmware/esp32/clock/main/chessclock.c \
            -o /tmp/test_chessclock && /tmp/test_chessclock
          cc -Wall -Wextra -Werror -c firmware/esp32/common/proto.c -o /dev/null
