<svg xmlns="http://www.w3.org/2000/svg" class="docfig" viewBox="0 0 960 640" role="img" aria-label="L'echelle des tests du banc, du bas vers le haut : ohmmetre carte seule, 12 V seul et points de test, Nucleo et console, quadrant et nappe, un puck et sa note, les quatre pucks avec la calibration et les LED, puis la campagne de mesures M1 a M11">
<style>
svg.docfig{font-family:"IBM Plex Sans", "Segoe UI", "DejaVu Sans", Helvetica, Arial, sans-serif;color:#1a1e1d}
.lbl{font-size:12.5px;fill:#1a1e1d}
.lbl.small{font-size:11px}
.lbl.strong{font-weight:600}
.muted{fill:#4f5754}
.mono{font-family:"IBM Plex Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace}
.glyph{font-size:20px;font-family:"Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", "DejaVu Sans", sans-serif}
.title{font-size:14px;font-weight:600;fill:#1a1e1d}
.axis{stroke:currentColor;stroke-width:1.2;fill:none;opacity:.55}
.tick{stroke:currentColor;stroke-width:1;opacity:.55}
.grid{stroke:currentColor;stroke-width:1;opacity:.12}
.dash{stroke:currentColor;stroke-width:1;stroke-dasharray:5 4;opacity:.5;fill:none}
.brk{stroke:currentColor;stroke-width:1.2;opacity:.6;fill:none}
.trace{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.trace.ghost{opacity:.35;stroke-dasharray:3 3}
.env{fill:none;stroke-width:1.2;stroke-dasharray:4 4;opacity:.7}
.q-high{stroke:#2a78d6}
.q-low{stroke:#eb6834}
.q-high-t{fill:#2a78d6;font-weight:600}
.q-low-t{fill:#eb6834;font-weight:600}
.mark{stroke-width:1.6}
.dot{fill:#ffffff;stroke-width:2.5}
.band{fill:rgba(42,120,214,.09)}
.peak-black{fill:#2a78d6;stroke:#2a78d6;stroke-width:1.5;stroke-linejoin:round;opacity:.9}
.peak-white{fill:#ffffff;stroke:#2a78d6;stroke-width:1.8;stroke-linejoin:round}
.tipbox{fill:#ffffff;stroke:#d3d8d4}
.lay-pcb{fill:#c4d9c0} .lay-air{fill:#f7f9f7} .lay-wood{fill:#e6d3b1} .lay-felt{fill:#c9ccc4}
.copper{fill:#c8843a}
.piece{fill:#efe6d6;stroke:currentColor;stroke-width:1.2;opacity:.95}
.bundle{fill:url(#wire);stroke:currentColor;stroke-width:1}
.cap{fill:#eb6834;stroke:none}
.magnet{fill:#8b8f92;opacity:.75}
.field{fill:none;stroke:#2a78d6;stroke-width:1.6;opacity:.8}
.seg{fill:#e9eef4;stroke:#d3d8d4}
.seg-pulse{fill:#eb6834;opacity:.35;stroke:#eb6834}
.seg-listen{fill:rgba(42,120,214,.09);stroke:#2a78d6}
.box{fill:#ffffff;stroke:#d3d8d4;stroke-width:1.2}
.box-piece{stroke:#2a78d6;stroke-width:1.8}
.box-mcu{fill:#e9eef4;stroke:#2a78d6;stroke-width:1.8}
.box-soft{fill:#e9eef4;stroke:#d3d8d4;stroke-width:1.2}
.box-warm{fill:#ffffff;stroke:#eb6834;stroke-width:1.6}
.wire{stroke:currentColor;stroke-width:1.4;fill:none;opacity:.7}
.wire-a{stroke:#2a78d6;stroke-width:2;fill:none}
.wire-p{stroke:#eb6834;stroke-width:2;fill:none}
.zone{fill:none;stroke:#d3d8d4;stroke-width:1.2;stroke-dasharray:6 4}
.coil{fill:none;stroke:#c8843a;stroke-width:2}
.puck{fill:#efe6d6;stroke:currentColor;stroke-width:1.2}
</style>
<rect width="960" height="640" fill="#ffffff"/>
<defs><marker id="arr23" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<text class="lbl small" x="40.0" y="40.0">Monter un échelon à la fois : on ne passe au suivant qu'une fois</text>
<text class="lbl small" x="40.0" y="54.0">le précédent réussi, et on note ce qu'on a lu.</text>
<rect class="box box-soft" x="40" y="560" width="600" height="62" rx="6"/>
<circle class="dot q-high" cx="66.0" cy="591.0" r="13.0"/><text class="lbl strong q-high-t" x="66.0" y="595.5" text-anchor="middle">1</text>
<text class="lbl strong" x="90.0" y="582.0">Carte seule, ohmmètre</text>
<text class="lbl small" x="90.0" y="599.0">entre VIN, 5V, 5VA, 3V3 et la masse (points de test)</text>
<text class="lbl small q-high-t" x="90.0" y="614.0">jamais zéro ohm : pas de court-circuit</text>
<rect class="box box-soft" x="40" y="484" width="600" height="62" rx="6"/>
<circle class="dot q-high" cx="66.0" cy="515.0" r="13.0"/><text class="lbl strong q-high-t" x="66.0" y="519.5" text-anchor="middle">2</text>
<text class="lbl strong" x="90.0" y="506.0">12 V seul, sans Nucleo</text>
<text class="lbl small" x="90.0" y="523.0">alimentation limitée à 100 mA, jack branché</text>
<text class="lbl small q-high-t" x="90.0" y="538.0">TP6 12 V, TP3 5,0 V, TP2 5,0 V ; moins de 30 mA</text>
<line class="wire" x1="654.0" y1="620.0" x2="654.0" y2="550.0" marker-end="url(#arr23)"/>
<rect class="box box-soft" x="40" y="408" width="600" height="62" rx="6"/>
<circle class="dot q-high" cx="66.0" cy="439.0" r="13.0"/><text class="lbl strong q-high-t" x="66.0" y="443.5" text-anchor="middle">3</text>
<text class="lbl strong" x="90.0" y="430.0">Nucleo et console</text>
<text class="lbl small" x="90.0" y="447.0">USB, 115200 bauds, firmware make NUCLEO=1, touche h</text>
<text class="lbl small q-high-t" x="90.0" y="462.0">TP4 3,3 V ; bannière « # LC chessboard, nucleo bench »</text>
<line class="wire" x1="654.0" y1="544.0" x2="654.0" y2="474.0" marker-end="url(#arr23)"/>
<rect class="box box-soft" x="40" y="332" width="600" height="62" rx="6"/>
<circle class="dot q-high" cx="66.0" cy="363.0" r="13.0"/><text class="lbl strong q-high-t" x="66.0" y="367.5" text-anchor="middle">4</text>
<text class="lbl strong" x="90.0" y="354.0">Quadrant et nappe</text>
<text class="lbl small" x="90.0" y="371.0">nappe engagée aux deux bouts, touche s</text>
<text class="lbl small q-high-t" x="90.0" y="386.0">quatre lignes CSV, amplitude faible : le bruit des cases vides</text>
<line class="wire" x1="654.0" y1="468.0" x2="654.0" y2="398.0" marker-end="url(#arr23)"/>
<rect class="box box-piece" x="40" y="256" width="600" height="62" rx="6"/>
<circle class="dot q-high" cx="66.0" cy="287.0" r="13.0"/><text class="lbl strong q-high-t" x="66.0" y="291.5" text-anchor="middle">5</text>
<text class="lbl strong" x="90.0" y="278.0">Un puck, sa note</text>
<text class="lbl small" x="90.0" y="295.0">pion noir sur une case, touche s, puis r pour le brut</text>
<text class="lbl small q-high-t" x="90.0" y="310.0">fa ≈ 217 kHz à ± 3 % ; l'enveloppe dure la fenêtre de 136 µs</text>
<line class="wire" x1="654.0" y1="392.0" x2="654.0" y2="322.0" marker-end="url(#arr23)"/>
<rect class="box box-piece" x="40" y="180" width="600" height="62" rx="6"/>
<circle class="dot q-high" cx="66.0" cy="211.0" r="13.0"/><text class="lbl strong q-high-t" x="66.0" y="215.5" text-anchor="middle">6</text>
<text class="lbl strong" x="90.0" y="202.0">Quatre pucks, calibration, LED</text>
<text class="lbl small" x="90.0" y="219.0">un puck par case, touche c, puis i, puis l</text>
<text class="lbl small q-high-t" x="90.0" y="234.0">i nomme les quatre pucks sans erreur, l allume leurs cases</text>
<line class="wire" x1="654.0" y1="316.0" x2="654.0" y2="246.0" marker-end="url(#arr23)"/>
<rect class="box box-warm" x="40" y="104" width="600" height="62" rx="6"/>
<circle class="dot q-high" cx="66.0" cy="135.0" r="13.0"/><text class="lbl strong q-high-t" x="66.0" y="139.5" text-anchor="middle">7</text>
<text class="lbl strong" x="90.0" y="126.0">La campagne M1 à M11</text>
<text class="lbl small" x="90.0" y="143.0">protocole measurements/protocol.md, un CSV par mesure</text>
<text class="lbl small q-high-t" x="90.0" y="158.0">Q ≥ 30 avec la ferrite (M2) : la mesure qui décide</text>
<line class="wire" x1="654.0" y1="240.0" x2="654.0" y2="170.0" marker-end="url(#arr23)"/>
<text class="lbl mono muted" x="690.0" y="40.0">CE QUE LA CONSOLE ÉCRIT</text>
<text class="lbl mono small" x="690.0" y="62.0">q,coil,sq,fa_hz,fb_hz,amp_mv,snr_db10</text>
<text class="lbl mono small strong" x="690.0" y="88.0">q, coil, sq</text>
<text class="lbl small muted" x="690.0" y="102.0">quadrant, bobine, case</text>
<text class="lbl small muted" x="690.0" y="116.0">(a1 = 0, b1 = 1, a2 = 8, b2 = 9)</text>
<text class="lbl mono small strong" x="690.0" y="134.0">fa_hz</text>
<text class="lbl small muted" x="690.0" y="148.0">la note par FFT, à 1 kHz près</text>
<text class="lbl mono small strong" x="690.0" y="166.0">fb_hz</text>
<text class="lbl small muted" x="690.0" y="180.0">la même note par comptage de période</text>
<text class="lbl mono small strong" x="690.0" y="198.0">amp_mv</text>
<text class="lbl small muted" x="690.0" y="212.0">l'amplitude de la sonnerie</text>
<text class="lbl mono small strong" x="690.0" y="230.0">snr_db10</text>
<text class="lbl small muted" x="690.0" y="244.0">signal sur bruit, en dixièmes de dB</text>
<text class="lbl mono muted" x="690.0" y="272.0">LES TOUCHES</text>
<text class="lbl mono small strong" x="690.0" y="296.0">h</text>
<text class="lbl small" x="736.0" y="296.0">aide</text>
<text class="lbl mono small strong" x="690.0" y="316.0">s</text>
<text class="lbl small" x="736.0" y="316.0">un balayage</text>
<text class="lbl mono small strong" x="690.0" y="336.0">m / x</text>
<text class="lbl small" x="736.0" y="336.0">balayage répété, stop</text>
<text class="lbl mono small strong" x="690.0" y="356.0">r</text>
<text class="lbl small" x="736.0" y="356.0">512 points bruts de la case a1</text>
<text class="lbl mono small strong" x="690.0" y="376.0">c</text>
<text class="lbl small" x="736.0" y="376.0">calibrer, en flash</text>
<text class="lbl mono small strong" x="690.0" y="396.0">i</text>
<text class="lbl small" x="736.0" y="396.0">identifier</text>
<text class="lbl mono small strong" x="690.0" y="416.0">l / o</text>
<text class="lbl small" x="736.0" y="416.0">LED des cases reconnues, extinction</text>
<text class="lbl mono small strong" x="690.0" y="436.0">p / P</text>
<text class="lbl small" x="736.0" y="436.0">impulsion plus courte, plus longue</text>
<text class="lbl small strong" x="690.0" y="468.0">À l'oscilloscope, avant de croire</text>
<text class="lbl small strong" x="690.0" y="482.0">le firmware :</text>
<text class="lbl small muted" x="690.0" y="500.0">TP1 du quadrant (AMP_OUT) et TP3</text>
<text class="lbl small muted" x="690.0" y="514.0">(bus d'impulsion) ; la sonnerie doit</text>
<text class="lbl small muted" x="690.0" y="528.0">remplir la fenêtre sans écrêter, sinon</text>
<text class="lbl small muted" x="690.0" y="542.0">changer la résistance de gain (note 19).</text>
</svg>
