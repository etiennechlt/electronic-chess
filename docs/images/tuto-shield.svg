<svg xmlns="http://www.w3.org/2000/svg" class="docfig" viewBox="0 0 960 520" role="img" aria-label="Coupe de la carte de banc emboitee sur la Nucleo : composants dessus, barrettes males soudees cote cuivre avec le corps sous la carte, et l'ordre de soudure en six etapes">
<style>
svg.docfig{font-family:"IBM Plex Sans", "Segoe UI", "DejaVu Sans", Helvetica, Arial, sans-serif;color:#1a1e1d}
.lbl{font-size:12.5px;fill:#1a1e1d}
.lbl.small{font-size:11px}
.lbl.strong{font-weight:600}
.muted{fill:#4f5754}
.mono{font-family:"IBM Plex Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace}
.glyph{font-size:20px;font-family:"Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", "DejaVu Sans", sans-serif}
.title{font-size:14px;font-weight:600;fill:#1a1e1d}
.axis{stroke:currentColor;stroke-width:1.2;fill:none;opacity:.55}
.tick{stroke:currentColor;stroke-width:1;opacity:.55}
.grid{stroke:currentColor;stroke-width:1;opacity:.12}
.dash{stroke:currentColor;stroke-width:1;stroke-dasharray:5 4;opacity:.5;fill:none}
.brk{stroke:currentColor;stroke-width:1.2;opacity:.6;fill:none}
.trace{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.trace.ghost{opacity:.35;stroke-dasharray:3 3}
.env{fill:none;stroke-width:1.2;stroke-dasharray:4 4;opacity:.7}
.q-high{stroke:#2a78d6}
.q-low{stroke:#eb6834}
.q-high-t{fill:#2a78d6;font-weight:600}
.q-low-t{fill:#eb6834;font-weight:600}
.mark{stroke-width:1.6}
.dot{fill:#ffffff;stroke-width:2.5}
.band{fill:rgba(42,120,214,.09)}
.peak-black{fill:#2a78d6;stroke:#2a78d6;stroke-width:1.5;stroke-linejoin:round;opacity:.9}
.peak-white{fill:#ffffff;stroke:#2a78d6;stroke-width:1.8;stroke-linejoin:round}
.tipbox{fill:#ffffff;stroke:#d3d8d4}
.lay-pcb{fill:#c4d9c0} .lay-air{fill:#f7f9f7} .lay-wood{fill:#e6d3b1} .lay-felt{fill:#c9ccc4}
.copper{fill:#c8843a}
.piece{fill:#efe6d6;stroke:currentColor;stroke-width:1.2;opacity:.95}
.bundle{fill:url(#wire);stroke:currentColor;stroke-width:1}
.cap{fill:#eb6834;stroke:none}
.magnet{fill:#8b8f92;opacity:.75}
.field{fill:none;stroke:#2a78d6;stroke-width:1.6;opacity:.8}
.seg{fill:#e9eef4;stroke:#d3d8d4}
.seg-pulse{fill:#eb6834;opacity:.35;stroke:#eb6834}
.seg-listen{fill:rgba(42,120,214,.09);stroke:#2a78d6}
.box{fill:#ffffff;stroke:#d3d8d4;stroke-width:1.2}
.box-piece{stroke:#2a78d6;stroke-width:1.8}
.box-mcu{fill:#e9eef4;stroke:#2a78d6;stroke-width:1.8}
.box-soft{fill:#e9eef4;stroke:#d3d8d4;stroke-width:1.2}
.box-warm{fill:#ffffff;stroke:#eb6834;stroke-width:1.6}
.wire{stroke:currentColor;stroke-width:1.4;fill:none;opacity:.7}
.wire-a{stroke:#2a78d6;stroke-width:2;fill:none}
.wire-p{stroke:#eb6834;stroke-width:2;fill:none}
.zone{fill:none;stroke:#d3d8d4;stroke-width:1.2;stroke-dasharray:6 4}
.coil{fill:none;stroke:#c8843a;stroke-width:2}
.puck{fill:#efe6d6;stroke:currentColor;stroke-width:1.2}
</style>
<rect width="960" height="520" fill="#ffffff"/>
<defs><marker id="arr21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<text class="lbl mono muted" x="20.0" y="24.0">EN COUPE, UNE FOIS EMBOÎTÉE</text>
<rect class="lay-pcb" x="60" y="290" width="520" height="16"/>
<text class="lbl small muted" x="588.0" y="302.0">Nucleo</text>
<rect class="lay-pcb" x="100" y="200" width="480" height="16"/>
<text class="lbl small muted" x="588.0" y="212.0">carte de banc</text>
<rect class="box" x="170" y="260" width="60" height="30" rx="2"/>
<rect class="box-soft" x="176" y="216" width="48" height="10" rx="1"/>
<line class="wire" x1="182" y1="194" x2="182" y2="282"/>
<line class="wire" x1="194" y1="194" x2="194" y2="282"/>
<line class="wire" x1="206" y1="194" x2="206" y2="282"/>
<line class="wire" x1="218" y1="194" x2="218" y2="282"/>
<rect class="box" x="340" y="260" width="60" height="30" rx="2"/>
<rect class="box-soft" x="346" y="216" width="48" height="10" rx="1"/>
<line class="wire" x1="352" y1="194" x2="352" y2="282"/>
<line class="wire" x1="364" y1="194" x2="364" y2="282"/>
<line class="wire" x1="376" y1="194" x2="376" y2="282"/>
<line class="wire" x1="388" y1="194" x2="388" y2="282"/>
<rect class="box" x="480" y="260" width="60" height="30" rx="2"/>
<rect class="box-soft" x="486" y="216" width="48" height="10" rx="1"/>
<line class="wire" x1="492" y1="194" x2="492" y2="282"/>
<line class="wire" x1="504" y1="194" x2="504" y2="282"/>
<line class="wire" x1="516" y1="194" x2="516" y2="282"/>
<line class="wire" x1="528" y1="194" x2="528" y2="282"/>
<rect class="box" x="110" y="182" width="44" height="18" rx="2"/>
<text class="lbl small" x="132.0" y="177.0" text-anchor="middle">jack 12 V</text>
<rect class="box" x="190" y="188" width="26" height="12" rx="2"/>
<text class="lbl small" x="203.0" y="183.0" text-anchor="middle">buck</text>
<rect class="box" x="245" y="190" width="20" height="10" rx="2"/>
<text class="lbl small" x="255.0" y="185.0" text-anchor="middle">LDO</text>
<rect class="box" x="300" y="190" width="30" height="10" rx="2"/>
<text class="lbl small" x="315.0" y="185.0" text-anchor="middle">FPC</text>
<rect class="box" x="410" y="190" width="14" height="10" rx="2"/>
<text class="lbl small" x="417.0" y="185.0" text-anchor="middle">tampon</text>
<rect class="box" x="460" y="184" width="26" height="16" rx="2"/>
<text class="lbl small" x="473.0" y="179.0" text-anchor="middle">JP1</text>
<path class="wire-a" d="M330 195 H360 V154" marker-end="url(#arr21)"/>
<text class="lbl small q-high-t" x="366.0" y="160.0">nappe vers le quadrant</text>
<line class="dash" x1="80" y1="216" x2="80" y2="290"/>
<text class="lbl small muted" x="72.0" y="257.0" text-anchor="end">~11 mm</text>
<text class="lbl small" x="60.0" y="330.0">Les barrettes mâles : corps sous la carte de banc, broches vers le bas, soudées côté cuivre (dessous) ;</text>
<text class="lbl small" x="60.0" y="344.0">leurs pointes dépassent à peine sur le dessus. Les embases femelles sont celles de la Nucleo.</text>
<text class="lbl small muted" x="60.0" y="382.0">Pourquoi cet ordre : les petits boîtiers plats se posent sur une carte encore vide ; les barrettes viennent</text>
<text class="lbl small muted" x="60.0" y="396.0">en dernier parce qu'une fois soudées la carte ne se pose plus à plat. Les emboîter dans la Nucleo avant de</text>
<text class="lbl small muted" x="60.0" y="410.0">les souder garantit qu'elles restent perpendiculaires et au bon pas.</text>
<text class="lbl small" x="60.0" y="446.0">Le cavalier JP1 : broches 1 et 2, le 5VA vient du LDO (position de départ) ; 2 et 3, il vient du buck (mesure M8).</text>
<text class="lbl mono muted" x="660.0" y="24.0">L'ORDRE DE SOUDURE</text>
<circle class="dot q-high" cx="674.0" cy="70.0" r="13.0"/><text class="lbl strong q-high-t" x="674.0" y="74.5" text-anchor="middle">1</text>
<text class="lbl strong" x="696.0" y="66.0">buck TPS62130, boîtier QFN</text>
<text class="lbl small muted" x="696.0" y="82.0">air chaud ou plaque, pâte à braser</text>
<circle class="dot q-high" cx="674.0" cy="134.0" r="13.0"/><text class="lbl strong q-high-t" x="674.0" y="138.5" text-anchor="middle">2</text>
<text class="lbl strong" x="696.0" y="130.0">les autres CMS</text>
<text class="lbl small muted" x="696.0" y="146.0">LDO, tampon, diodes, perle, R et C</text>
<circle class="dot q-high" cx="674.0" cy="198.0" r="13.0"/><text class="lbl strong q-high-t" x="674.0" y="202.5" text-anchor="middle">3</text>
<text class="lbl strong" x="696.0" y="194.0">connecteur FPC Hirose</text>
<text class="lbl small muted" x="696.0" y="210.0">pattes fines : flux, fer fin, loupe</text>
<circle class="dot q-high" cx="674.0" cy="262.0" r="13.0"/><text class="lbl strong q-high-t" x="674.0" y="266.5" text-anchor="middle">4</text>
<text class="lbl strong" x="696.0" y="258.0">jack, JP1, points de test</text>
<text class="lbl small muted" x="696.0" y="274.0">traversants, fer classique</text>
<circle class="dot q-high" cx="674.0" cy="326.0" r="13.0"/><text class="lbl strong q-high-t" x="674.0" y="330.5" text-anchor="middle">5</text>
<text class="lbl strong" x="696.0" y="322.0">les quatre barrettes mâles</text>
<text class="lbl small muted" x="696.0" y="338.0">emboîtées dans la Nucleo, puis soudées</text>
<circle class="dot q-high" cx="674.0" cy="390.0" r="13.0"/><text class="lbl strong q-high-t" x="674.0" y="394.5" text-anchor="middle">6</text>
<text class="lbl strong" x="696.0" y="386.0">contrôle à l'ohmmètre</text>
<text class="lbl small muted" x="696.0" y="402.0">aucun rail en court-circuit à la masse</text>
</svg>
