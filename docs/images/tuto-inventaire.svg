<svg xmlns="http://www.w3.org/2000/svg" class="docfig" viewBox="0 0 960 600" role="img" aria-label="Ce que reunit le banc : a gauche la Nucleo sous la carte de banc reliee au 12 V et au PC, a droite le quadrant 2 x 2 sous le contreplaque et le feutre avec les quatre pucks de test, la nappe entre les deux">
<style>
svg.docfig{font-family:"IBM Plex Sans", "Segoe UI", "DejaVu Sans", Helvetica, Arial, sans-serif;color:#1a1e1d}
.lbl{font-size:12.5px;fill:#1a1e1d}
.lbl.small{font-size:11px}
.lbl.strong{font-weight:600}
.muted{fill:#4f5754}
.mono{font-family:"IBM Plex Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace}
.glyph{font-size:20px;font-family:"Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", "DejaVu Sans", sans-serif}
.title{font-size:14px;font-weight:600;fill:#1a1e1d}
.axis{stroke:currentColor;stroke-width:1.2;fill:none;opacity:.55}
.tick{stroke:currentColor;stroke-width:1;opacity:.55}
.grid{stroke:currentColor;stroke-width:1;opacity:.12}
.dash{stroke:currentColor;stroke-width:1;stroke-dasharray:5 4;opacity:.5;fill:none}
.brk{stroke:currentColor;stroke-width:1.2;opacity:.6;fill:none}
.trace{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.trace.ghost{opacity:.35;stroke-dasharray:3 3}
.env{fill:none;stroke-width:1.2;stroke-dasharray:4 4;opacity:.7}
.q-high{stroke:#2a78d6}
.q-low{stroke:#eb6834}
.q-high-t{fill:#2a78d6;font-weight:600}
.q-low-t{fill:#eb6834;font-weight:600}
.mark{stroke-width:1.6}
.dot{fill:#ffffff;stroke-width:2.5}
.band{fill:rgba(42,120,214,.09)}
.peak-black{fill:#2a78d6;stroke:#2a78d6;stroke-width:1.5;stroke-linejoin:round;opacity:.9}
.peak-white{fill:#ffffff;stroke:#2a78d6;stroke-width:1.8;stroke-linejoin:round}
.tipbox{fill:#ffffff;stroke:#d3d8d4}
.lay-pcb{fill:#c4d9c0} .lay-air{fill:#f7f9f7} .lay-wood{fill:#e6d3b1} .lay-felt{fill:#c9ccc4}
.copper{fill:#c8843a}
.piece{fill:#efe6d6;stroke:currentColor;stroke-width:1.2;opacity:.95}
.bundle{fill:url(#wire);stroke:currentColor;stroke-width:1}
.cap{fill:#eb6834;stroke:none}
.magnet{fill:#8b8f92;opacity:.75}
.field{fill:none;stroke:#2a78d6;stroke-width:1.6;opacity:.8}
.seg{fill:#e9eef4;stroke:#d3d8d4}
.seg-pulse{fill:#eb6834;opacity:.35;stroke:#eb6834}
.seg-listen{fill:rgba(42,120,214,.09);stroke:#2a78d6}
.box{fill:#ffffff;stroke:#d3d8d4;stroke-width:1.2}
.box-piece{stroke:#2a78d6;stroke-width:1.8}
.box-mcu{fill:#e9eef4;stroke:#2a78d6;stroke-width:1.8}
.box-soft{fill:#e9eef4;stroke:#d3d8d4;stroke-width:1.2}
.box-warm{fill:#ffffff;stroke:#eb6834;stroke-width:1.6}
.wire{stroke:currentColor;stroke-width:1.4;fill:none;opacity:.7}
.wire-a{stroke:#2a78d6;stroke-width:2;fill:none}
.wire-p{stroke:#eb6834;stroke-width:2;fill:none}
.zone{fill:none;stroke:#d3d8d4;stroke-width:1.2;stroke-dasharray:6 4}
.coil{fill:none;stroke:#c8843a;stroke-width:2}
.puck{fill:#efe6d6;stroke:currentColor;stroke-width:1.2}
</style>
<rect width="960" height="600" fill="#ffffff"/>
<defs><marker id="arr20" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="arr20b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<text class="lbl mono muted" x="20.0" y="24.0">LE CÔTÉ MESURE</text>
<rect class="lay-pcb" x="170" y="330" width="300" height="14"/>
<rect class="box-soft" x="180" y="304" width="46" height="26" rx="3"/>
<text class="lbl small" x="203.0" y="321.0" text-anchor="middle">USB</text>
<rect class="box" x="270" y="312" width="34" height="18" rx="2"/>
<rect class="box" x="320" y="312" width="34" height="18" rx="2"/>
<rect class="box" x="370" y="312" width="34" height="18" rx="2"/>
<rect class="box" x="420" y="312" width="34" height="18" rx="2"/>
<text class="lbl strong" x="170.0" y="364.0" text-anchor="start">Nucleo-G474RE</text>
<text class="lbl small muted" x="170.0" y="378.0" text-anchor="start">le même microcontrôleur que le cerveau,</text>
<text class="lbl small muted" x="170.0" y="392.0" text-anchor="start">sa sonde de programmation, son port série</text>
<rect class="lay-pcb" x="230" y="240" width="270" height="14"/>
<rect class="box" x="276" y="254" width="22" height="12" rx="1"/>
<line class="wire" x1="280" y1="266" x2="280" y2="286"/>
<line class="wire" x1="287" y1="266" x2="287" y2="286"/>
<line class="wire" x1="294" y1="266" x2="294" y2="286"/>
<rect class="box" x="326" y="254" width="22" height="12" rx="1"/>
<line class="wire" x1="330" y1="266" x2="330" y2="286"/>
<line class="wire" x1="337" y1="266" x2="337" y2="286"/>
<line class="wire" x1="344" y1="266" x2="344" y2="286"/>
<rect class="box" x="376" y="254" width="22" height="12" rx="1"/>
<line class="wire" x1="380" y1="266" x2="380" y2="286"/>
<line class="wire" x1="387" y1="266" x2="387" y2="286"/>
<line class="wire" x1="394" y1="266" x2="394" y2="286"/>
<rect class="box" x="426" y="254" width="22" height="12" rx="1"/>
<line class="wire" x1="430" y1="266" x2="430" y2="286"/>
<line class="wire" x1="437" y1="266" x2="437" y2="286"/>
<line class="wire" x1="444" y1="266" x2="444" y2="286"/>
<rect class="box" x="236" y="222" width="48" height="18" rx="2"/>
<text class="lbl small" x="260.0" y="234.0" text-anchor="middle">jack 12 V</text>
<rect class="box" x="300" y="222" width="26" height="18" rx="2"/>
<text class="lbl small" x="313.0" y="234.0" text-anchor="middle">buck 5 V</text>
<rect class="box" x="356" y="222" width="26" height="18" rx="2"/>
<text class="lbl small" x="369.0" y="234.0" text-anchor="middle">LDO 5VA</text>
<rect class="box" x="410" y="222" width="26" height="18" rx="2"/>
<text class="lbl small" x="423.0" y="234.0" text-anchor="middle">tampon</text>
<rect class="box" x="460" y="222" width="36" height="18" rx="2"/>
<text class="lbl small" x="478.0" y="234.0" text-anchor="middle">FPC</text>
<line class="wire" x1="360.0" y1="290.0" x2="360.0" y2="306.0" marker-end="url(#arr20)"/>
<text class="lbl small muted" x="368.0" y="310.0">s'emboîte sur les embases Arduino</text>
<text class="lbl strong" x="230.0" y="178.0" text-anchor="start">Carte de banc, 80 x 56 mm</text>
<text class="lbl small muted" x="230.0" y="192.0" text-anchor="start">le 12 V protégé, le 5 V des LED, le 5 V analogique,</text>
<text class="lbl small muted" x="230.0" y="206.0" text-anchor="start">le tampon LED et le connecteur de nappe</text>
<rect class="box-warm" x="20.0" y="210.0" width="130.0" height="54.0" rx="6"/>
<text class="lbl strong" x="85.0" y="226.0" text-anchor="middle">Alimentation 12 V</text>
<text class="lbl small" x="85.0" y="241.0" text-anchor="middle">de laboratoire,</text>
<text class="lbl small" x="85.0" y="256.0" text-anchor="middle">limitée en courant</text>
<path class="wire-p" d="M150 237 H210 V231 H232" marker-end="url(#arr20)"/>
<rect class="box-soft" x="20.0" y="304.0" width="130.0" height="54.0" rx="6"/>
<text class="lbl strong" x="85.0" y="320.0" text-anchor="middle">PC</text>
<text class="lbl small" x="85.0" y="335.0" text-anchor="middle">console série 115200</text>
<text class="lbl small" x="85.0" y="350.0" text-anchor="middle">make NUCLEO=1</text>
<line class="wire" x1="150.0" y1="317.0" x2="178.0" y2="317.0" marker-end="url(#arr20)"/>
<text class="lbl mono muted" x="540.0" y="24.0">LE CÔTÉ ÉCHIQUIER</text>
<rect class="lay-pcb" x="540" y="420" width="380" height="14"/>
<rect class="box-soft" x="540" y="404" width="63" height="16" rx="2"/>
<text class="lbl small" x="571.7" y="415.0" text-anchor="middle">frontal</text>
<rect class="box" x="542" y="390" width="30" height="14" rx="2"/>
<text class="lbl small" x="557.0" y="400.0" text-anchor="middle">FPC</text>
<ellipse class="coil" cx="682.5" cy="427" rx="66.5" ry="4"/>
<ellipse class="coil" cx="682.5" cy="427" rx="47.5" ry="4"/>
<ellipse class="coil" cx="682.5" cy="427" rx="28.5" ry="4"/>
<ellipse class="coil" cx="840.8" cy="427" rx="66.5" ry="4"/>
<ellipse class="coil" cx="840.8" cy="427" rx="47.5" ry="4"/>
<ellipse class="coil" cx="840.8" cy="427" rx="28.5" ry="4"/>
<text class="lbl strong" x="540.0" y="454.0" text-anchor="start">Quadrant 2 x 2, 120 x 108 mm, 4 couches</text>
<text class="lbl small muted" x="540.0" y="468.0" text-anchor="start">quatre spirales gravées dans le circuit, huit LED,</text>
<text class="lbl small muted" x="540.0" y="482.0" text-anchor="start">le frontal analogique complet sur sa bande</text>
<rect class="lay-wood" x="603.3333333333334" y="328" width="317" height="18"/>
<rect class="lay-felt" x="603.3333333333334" y="324.0" width="317" height="4.0"/>
<text class="lbl small muted" x="611.3" y="368.0">contreplaqué 3 mm et feutre 0,5 mm sur des entretoises :</text>
<text class="lbl small muted" x="611.3" y="382.0">2 mm d'air pour les LED, 7,1 mm d'entrefer sous la pièce,</text>
<text class="lbl small muted" x="611.3" y="396.0">deux trous de 2,5 mm par case au droit des LED</text>
<path class="puck" d="M646.9 323.0 v-14 q0 -10 10 -10 h51.2 q10 0 10 10 v14 z"/>
<text class="glyph" x="682.5" y="315.0" text-anchor="middle">♟</text>
<path class="puck" d="M805.2 323.0 v-14 q0 -10 10 -10 h51.2 q10 0 10 10 v14 z"/>
<text class="glyph" x="840.8" y="315.0" text-anchor="middle">♞</text>
<text class="lbl strong" x="633.3" y="140.0" text-anchor="start">Quatre pucks de test imprimés</text>
<text class="lbl small muted" x="633.3" y="154.0" text-anchor="start">bobine bobinée sur gabarit, condensateur C0G,</text>
<text class="lbl small muted" x="633.3" y="168.0" text-anchor="start">aimant ferrite ; pion, cavalier, fou, tour noirs :</text>
<text class="lbl small muted" x="633.3" y="182.0" text-anchor="start">♟ 12 nF, ♞ 10 nF, ♝ 8,2 nF, ♜ 6,8 nF</text>
<path class="wire-a" d="M478 220 C478 150 500 260 557 388" marker-end="url(#arr20b)"/>
<text class="lbl small q-high-t" x="500.0" y="92.0">nappe FPC 16 conducteurs, pas 0,5 mm :</text>
<text class="lbl small muted" x="500.0" y="106.0">le bus de commande, le signal amplifié, les rails</text>
<text class="lbl small muted" x="20.0" y="560.0">Rien de tout cela n'est le plateau final : le cerveau et la carte puissance attendent que ce banc ait mesuré</text>
<text class="lbl small muted" x="20.0" y="574.0">ce qui n'a été que calculé (note 19). Le firmware, le bus de commande et le quadrant sont ceux du plateau.</text>
</svg>
