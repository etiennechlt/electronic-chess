<svg xmlns="http://www.w3.org/2000/svg" class="docfig" viewBox="0 0 960 560" role="img" aria-label="Fabriquer un puck de test : bobiner le fil sur le gabarit imprime, coller, souder le condensateur, glisser bobine et aimant ferrite dans le puck ; tableau des quatre pucks avec condensateur, note attendue, diametres, tours et fil">
<style>
svg.docfig{font-family:"IBM Plex Sans", "Segoe UI", "DejaVu Sans", Helvetica, Arial, sans-serif;color:#1a1e1d}
.lbl{font-size:12.5px;fill:#1a1e1d}
.lbl.small{font-size:11px}
.lbl.strong{font-weight:600}
.muted{fill:#4f5754}
.mono{font-family:"IBM Plex Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace}
.glyph{font-size:20px;font-family:"Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", "DejaVu Sans", sans-serif}
.title{font-size:14px;font-weight:600;fill:#1a1e1d}
.axis{stroke:currentColor;stroke-width:1.2;fill:none;opacity:.55}
.tick{stroke:currentColor;stroke-width:1;opacity:.55}
.grid{stroke:currentColor;stroke-width:1;opacity:.12}
.dash{stroke:currentColor;stroke-width:1;stroke-dasharray:5 4;opacity:.5;fill:none}
.brk{stroke:currentColor;stroke-width:1.2;opacity:.6;fill:none}
.trace{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.trace.ghost{opacity:.35;stroke-dasharray:3 3}
.env{fill:none;stroke-width:1.2;stroke-dasharray:4 4;opacity:.7}
.q-high{stroke:#2a78d6}
.q-low{stroke:#eb6834}
.q-high-t{fill:#2a78d6;font-weight:600}
.q-low-t{fill:#eb6834;font-weight:600}
.mark{stroke-width:1.6}
.dot{fill:#ffffff;stroke-width:2.5}
.band{fill:rgba(42,120,214,.09)}
.peak-black{fill:#2a78d6;stroke:#2a78d6;stroke-width:1.5;stroke-linejoin:round;opacity:.9}
.peak-white{fill:#ffffff;stroke:#2a78d6;stroke-width:1.8;stroke-linejoin:round}
.tipbox{fill:#ffffff;stroke:#d3d8d4}
.lay-pcb{fill:#c4d9c0} .lay-air{fill:#f7f9f7} .lay-wood{fill:#e6d3b1} .lay-felt{fill:#c9ccc4}
.copper{fill:#c8843a}
.piece{fill:#efe6d6;stroke:currentColor;stroke-width:1.2;opacity:.95}
.bundle{fill:url(#wire);stroke:currentColor;stroke-width:1}
.cap{fill:#eb6834;stroke:none}
.magnet{fill:#8b8f92;opacity:.75}
.field{fill:none;stroke:#2a78d6;stroke-width:1.6;opacity:.8}
.seg{fill:#e9eef4;stroke:#d3d8d4}
.seg-pulse{fill:#eb6834;opacity:.35;stroke:#eb6834}
.seg-listen{fill:rgba(42,120,214,.09);stroke:#2a78d6}
.box{fill:#ffffff;stroke:#d3d8d4;stroke-width:1.2}
.box-piece{stroke:#2a78d6;stroke-width:1.8}
.box-mcu{fill:#e9eef4;stroke:#2a78d6;stroke-width:1.8}
.box-soft{fill:#e9eef4;stroke:#d3d8d4;stroke-width:1.2}
.box-warm{fill:#ffffff;stroke:#eb6834;stroke-width:1.6}
.wire{stroke:currentColor;stroke-width:1.4;fill:none;opacity:.7}
.wire-a{stroke:#2a78d6;stroke-width:2;fill:none}
.wire-p{stroke:#eb6834;stroke-width:2;fill:none}
.zone{fill:none;stroke:#d3d8d4;stroke-width:1.2;stroke-dasharray:6 4}
.coil{fill:none;stroke:#c8843a;stroke-width:2}
.puck{fill:#efe6d6;stroke:currentColor;stroke-width:1.2}
</style>
<rect width="960" height="560" fill="#ffffff"/>
<defs><marker id="arr22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<circle class="dot q-high" cx="34.0" cy="40.0" r="13.0"/><text class="lbl strong q-high-t" x="34.0" y="44.5" text-anchor="middle">1</text>
<text class="lbl strong" x="56.0" y="45.0">Bobiner sur le gabarit imprimé</text>
<rect class="box-soft" x="60" y="120" width="150" height="8" rx="2"/>
<rect class="box-soft" x="60" y="80" width="150" height="8" rx="2"/>
<rect class="box" x="115" y="80" width="40" height="48"/>
<line class="wire" x1="135" y1="50" x2="135" y2="150"/>
<text class="lbl small muted" x="142.0" y="62.0">axe M3, dans une perceuse</text>
<rect class="copper" x="72" y="88.0" width="43" height="3" rx="1.5"/>
<rect class="copper" x="155" y="88.0" width="43" height="3" rx="1.5"/>
<rect class="copper" x="72" y="92.5" width="43" height="3" rx="1.5"/>
<rect class="copper" x="155" y="92.5" width="43" height="3" rx="1.5"/>
<rect class="copper" x="72" y="97.0" width="43" height="3" rx="1.5"/>
<rect class="copper" x="155" y="97.0" width="43" height="3" rx="1.5"/>
<rect class="copper" x="72" y="101.5" width="43" height="3" rx="1.5"/>
<rect class="copper" x="155" y="101.5" width="43" height="3" rx="1.5"/>
<rect class="copper" x="72" y="106.0" width="43" height="3" rx="1.5"/>
<rect class="copper" x="155" y="106.0" width="43" height="3" rx="1.5"/>
<rect class="copper" x="72" y="110.5" width="43" height="3" rx="1.5"/>
<rect class="copper" x="155" y="110.5" width="43" height="3" rx="1.5"/>
<text class="lbl small" x="60.0" y="170.0">fenêtre de 2 mm entre les flasques,</text>
<text class="lbl small" x="60.0" y="184.0">fil émaillé, spires serrées, vernis, puis retirer la rondelle</text>
<circle class="dot q-high" cx="34.0" cy="240.0" r="13.0"/><text class="lbl strong q-high-t" x="34.0" y="244.5" text-anchor="middle">2</text>
<text class="lbl strong" x="56.0" y="245.0">Souder le condensateur, une note par pièce</text>
<circle class="coil" cx="110" cy="320" r="34"/>
<circle class="coil" cx="110" cy="320" r="26"/>
<circle class="coil" cx="110" cy="320" r="18"/>
<circle class="coil" cx="110" cy="320" r="10"/>
<line class="wire" x1="144" y1="318" x2="200" y2="308"/>
<line class="wire" x1="120" y1="320" x2="200" y2="332"/>
<rect class="cap" x="198" y="304" width="14" height="32" rx="2"/>
<text class="lbl small" x="220.0" y="324.0">C0G 1 %, boîtier 0805</text>
<text class="lbl small muted" x="220.0" y="338.0">aux deux bouts du fil dénudé</text>
<text class="lbl small" x="60.0" y="380.0">bobine et condensateur font le résonateur :</text>
<text class="lbl small" x="60.0" y="394.0">L = 45 µH pour toutes les pièces, C change la note</text>
<circle class="dot q-high" cx="34.0" cy="440.0" r="13.0"/><text class="lbl strong q-high-t" x="34.0" y="444.5" text-anchor="middle">3</text>
<text class="lbl strong" x="56.0" y="445.0">Glisser dans le puck, aimant au-dessus</text>
<path class="puck" d="M70 540 v-58 q0 -12 12 -12 h116 q12 0 12 12 v58 z"/>
<rect class="magnet" x="100" y="492" width="80" height="18"/>
<text class="lbl small" x="140.0" y="505.0" text-anchor="middle">aimant ferrite</text>
<rect class="copper" x="94" y="518" width="9" height="9" rx="2"/>
<rect class="copper" x="107" y="518" width="9" height="9" rx="2"/>
<rect class="copper" x="120" y="518" width="9" height="9" rx="2"/>
<rect class="copper" x="133" y="518" width="9" height="9" rx="2"/>
<rect class="copper" x="146" y="518" width="9" height="9" rx="2"/>
<rect class="copper" x="159" y="518" width="9" height="9" rx="2"/>
<rect class="copper" x="172" y="518" width="9" height="9" rx="2"/>
<text class="lbl small muted" x="220.0" y="499.0">fente latérale pour le condensateur</text>
<text class="lbl small muted" x="220.0" y="513.0">poche d'aimant ajustée</text>
<text class="lbl small muted" x="220.0" y="527.0">bobine dans les 2 mm du bas</text>
<text class="lbl mono muted" x="470.0" y="38.0">LES QUATRE PUCKS DU BANC</text>
<text class="lbl small muted" x="470.0" y="60.0">pièce</text>
<text class="lbl small muted" x="600.0" y="60.0">C</text>
<text class="lbl small muted" x="665.0" y="60.0">note</text>
<text class="lbl small muted" x="735.0" y="60.0">bobine</text>
<text class="lbl small muted" x="830.0" y="60.0">tours</text>
<text class="lbl small muted" x="875.0" y="60.0">fil</text>
<line class="axis" x1="470" y1="66" x2="915" y2="66"/>
<text class="lbl" x="470.0" y="90.0">♟ pion noir</text>
<text class="lbl mono" x="600.0" y="90.0">12 nF</text>
<text class="lbl mono q-high-t" x="665.0" y="90.0">217 kHz</text>
<text class="lbl mono" x="735.0" y="90.0">ø 13,5 / 5,4</text>
<text class="lbl mono" x="830.0" y="90.0">75</text>
<text class="lbl mono" x="875.0" y="90.0">0,25</text>
<text class="lbl" x="470.0" y="116.0">♞ cavalier noir</text>
<text class="lbl mono" x="600.0" y="116.0">10 nF</text>
<text class="lbl mono q-high-t" x="665.0" y="116.0">237 kHz</text>
<text class="lbl mono" x="735.0" y="116.0">ø 16 / 6,4</text>
<text class="lbl mono" x="830.0" y="116.0">67</text>
<text class="lbl mono" x="875.0" y="116.0">0,25</text>
<text class="lbl" x="470.0" y="142.0">♝ fou noir</text>
<text class="lbl mono" x="600.0" y="142.0">8,2 nF</text>
<text class="lbl mono q-high-t" x="665.0" y="142.0">262 kHz</text>
<text class="lbl mono" x="735.0" y="142.0">ø 16 / 6,4</text>
<text class="lbl mono" x="830.0" y="142.0">67</text>
<text class="lbl mono" x="875.0" y="142.0">0,25</text>
<text class="lbl" x="470.0" y="168.0">♜ tour noire</text>
<text class="lbl mono" x="600.0" y="168.0">6,8 nF</text>
<text class="lbl mono q-high-t" x="665.0" y="168.0">288 kHz</text>
<text class="lbl mono" x="735.0" y="168.0">ø 18,5 / 7,4</text>
<text class="lbl mono" x="830.0" y="168.0">62</text>
<text class="lbl mono" x="875.0" y="168.0">0,315</text>
<text class="lbl small muted" x="470.0" y="200.0">bobine : diamètres extérieur et intérieur, mm ; fil : diamètre du cuivre, mm ;</text>
<text class="lbl small muted" x="470.0" y="214.0">tours calculés pour 45 µH (± 5 % à la main, soit ± 2,5 % sur la note) ;</text>
<text class="lbl small muted" x="470.0" y="228.0">aimants ferrite SrFe, épaisseur 4 mm, diamètres 12,5, 15, 17,5 mm selon la pièce.</text>
<text class="lbl small" x="470.0" y="262.0">Pourquoi ces quatre-là : le bas de la bande, là où les notes</text>
<text class="lbl small" x="470.0" y="276.0">sont les plus serrées. Si le banc les distingue sans erreur,</text>
<text class="lbl small" x="470.0" y="290.0">les huit autres classes, plus espacées, suivront.</text>
<text class="lbl small muted" x="470.0" y="324.0">La pièce sonne à travers 7,1 mm : le circuit imprimé, l'air,</text>
<text class="lbl small muted" x="470.0" y="338.0">le bois et le feutre. Le banc mesure ce que cet entrefer laisse passer.</text>
</svg>
