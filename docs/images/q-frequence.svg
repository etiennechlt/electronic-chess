<svg xmlns="http://www.w3.org/2000/svg" class="docfig" viewBox="0 0 900 340" role="img" aria-label="Q estime de la bobine du pion en fonction de la frequence, il monte de 6 a 40 kHz jusqu au dela de 80 a 600 kHz, la bande de mesure 200 a 650 kHz est en surbrillance">
<style>
svg.docfig{font-family:"IBM Plex Sans", "Segoe UI", "DejaVu Sans", Helvetica, Arial, sans-serif;color:#1a1e1d}
