<svg xmlns="http://www.w3.org/2000/svg" class="docfig" viewBox="0 0 900 380" role="img" aria-label="Coupe verticale : le capteur Hall en boitier SOT-23 pose sur le circuit imprime dans la lame d air, sous le contreplaque et le feutre, lit l aimant ferrite de la base de la piece a 6,9 mm">
<style>
svg.docfig{font-family:"IBM Plex Sans", "Segoe UI", "DejaVu Sans", Helvetica, Arial, sans-serif;color:#1a1e1d}
.lbl{font-size:12.5px;fill:#1a1e1d}
