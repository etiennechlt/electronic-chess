<svg xmlns="http://www.w3.org/2000/svg" class="docfig" viewBox="0 0 900 360" role="img" aria-label="Champ au capteur en fonction de la distance entre l aimant et la plaque de Hall, pour le pion et le roi : 25,3 et 32,1 mT a l entrefer nominal, le seuil de presence a 10,3 mT, le roi souleve de 15 mm sous le relachement">
<style>
svg.docfig{font-family:"IBM Plex Sans", "Segoe UI", "DejaVu Sans", Helvetica, Arial, sans-serif;color:#1a1e1d}
