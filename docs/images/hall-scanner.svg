<svg xmlns="http://www.w3.org/2000/svg" class="docfig" viewBox="0 0 960 430" role="img" aria-label="Schema bloc du scanner : quatre quadrants de seize capteurs Hall, un multiplexeur par quadrant, quatre entrees ADC de l ESP32-S3, quatre bits d adresse partages, quatre commutateurs d alimentation par rangee, la ligne B vers la console">
<style>
svg.docfig{font-family:"IBM Plex Sans", "Segoe UI", "DejaVu Sans", Helvetica, Arial, sans-serif;color:#1a1e1d}
.lbl{font-size:12.5px;fill:#1a1e1d}
.lbl.small{font-size:11px}
.lbl.strong{font-weight:600}
.muted{fill:#4f5754}
.mono{font-family:"IBM Plex Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace}
.glyph{font-size:20px;font-family:"Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", "DejaVu Sans", sans-serif}
.title{font-size:14px;font-weight:600;fill:#1a1e1d}
.axis{stroke:currentColor;stroke-width:1.2;fill:none;opacity:.55}
.tick{stroke:currentColor;stroke-width:1;opacity:.55}
.grid{stroke:currentColor;stroke-width:1;opacity:.12}
.dash{stroke:currentColor;stroke-width:1;stroke-dasharray:5 4;opacity:.5;fill:none}
.brk{stroke:currentColor;stroke-width:1.2;opacity:.6;fill:none}
.trace{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.trace.ghost{opacity:.35;stroke-dasharray:3 3}
.env{fill:none;stroke-width:1.2;stroke-dasharray:4 4;opacity:.7}
.q-high{stroke:#2a78d6}
.q-low{stroke:#eb6834}
.q-high-t{fill:#2a78d6;font-weight:600}
.q-low-t{fill:#eb6834;font-weight:600}
.mark{stroke-width:1.6}
.dot{fill:#ffffff;stroke-width:2.5}
.band{fill:rgba(42,120,214,.09)}
.peak-black{fill:#2a78d6;stroke:#2a78d6;stroke-width:1.5;stroke-linejoin:round;opacity:.9}
.peak-white{fill:#ffffff;stroke:#2a78d6;stroke-width:1.8;stroke-linejoin:round}
.tipbox{fill:#ffffff;stroke:#d3d8d4}
.lay-pcb{fill:#c4d9c0} .lay-air{fill:#f7f9f7} .lay-wood{fill:#e6d3b1} .lay-felt{fill:#c9ccc4}
.copper{fill:#c8843a}
.piece{fill:#efe6d6;stroke:currentColor;stroke-width:1.2;opacity:.95}
.bundle{fill:url(#wire);stroke:currentColor;stroke-width:1}
.cap{fill:#eb6834;stroke:none}
.magnet{fill:#8b8f92;opacity:.75}
.field{fill:none;stroke:#2a78d6;stroke-width:1.6;opacity:.8}
.seg{fill:#e9eef4;stroke:#d3d8d4}
.seg-pulse{fill:#eb6834;opacity:.35;stroke:#eb6834}
.seg-listen{fill:rgba(42,120,214,.09);stroke:#2a78d6}
.box{fill:#ffffff;stroke:#d3d8d4;stroke-width:1.2}
.box-piece{stroke:#2a78d6;stroke-width:1.8}
.box-mcu{fill:#e9eef4;stroke:#2a78d6;stroke-width:1.8}
.box-soft{fill:#e9eef4;stroke:#d3d8d4;stroke-width:1.2}
.box-warm{fill:#ffffff;stroke:#eb6834;stroke-width:1.6}
.wire{stroke:currentColor;stroke-width:1.4;fill:none;opacity:.7}
.wire-a{stroke:#2a78d6;stroke-width:2;fill:none}
.wire-p{stroke:#eb6834;stroke-width:2;fill:none}
.zone{fill:none;stroke:#d3d8d4;stroke-width:1.2;stroke-dasharray:6 4}
.coil{fill:none;stroke:#c8843a;stroke-width:2}
.puck{fill:#efe6d6;stroke:currentColor;stroke-width:1.2}
</style>
<rect width="960" height="430" fill="#ffffff"/>
<defs><marker id="sarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<text class="lbl mono muted" x="20.0" y="22.0">QUADRANTS</text>
<text class="lbl mono muted" x="330.0" y="22.0">MULTIPLEXEURS</text>
<text class="lbl mono muted" x="600.0" y="22.0">ESP32-S3-WROOM-1</text>
<rect class="box" x="20.0" y="40.0" width="230.0" height="62.0" rx="6"/>
<text class="lbl strong" x="135.0" y="60.0" text-anchor="middle">quadrant 1 : 16 capteurs DRV5053OA</text>
<text class="lbl small" x="135.0" y="75.0" text-anchor="middle">4 rangées de 4, un P-FET chacune</text>
<text class="lbl small" x="135.0" y="90.0" text-anchor="middle">sortie analogique, 3,3 V, masse</text>
<rect class="box" x="330.0" y="48.0" width="180.0" height="46.0" rx="6"/>
<text class="lbl strong" x="420.0" y="67.5" text-anchor="middle">CD74HC4067</text>
<text class="lbl small" x="420.0" y="82.5" text-anchor="middle">16 vers 1</text>
<line class="wire-a" x1="250.0" y1="71.0" x2="330.0" y2="71.0" marker-end="url(#sarr)"/>
<line class="wire-a" x1="510.0" y1="71.0" x2="600.0" y2="71.0" marker-end="url(#sarr)"/>
<text class="lbl small mono" x="515.0" y="64.0">ADC_Q1</text>
<rect class="box" x="20.0" y="122.0" width="230.0" height="62.0" rx="6"/>
<text class="lbl strong" x="135.0" y="142.0" text-anchor="middle">quadrant 2 : 16 capteurs DRV5053OA</text>
<text class="lbl small" x="135.0" y="157.0" text-anchor="middle">4 rangées de 4, un P-FET chacune</text>
<text class="lbl small" x="135.0" y="172.0" text-anchor="middle">sortie analogique, 3,3 V, masse</text>
<rect class="box" x="330.0" y="130.0" width="180.0" height="46.0" rx="6"/>
<text class="lbl strong" x="420.0" y="149.5" text-anchor="middle">CD74HC4067</text>
<text class="lbl small" x="420.0" y="164.5" text-anchor="middle">16 vers 1</text>
<line class="wire-a" x1="250.0" y1="153.0" x2="330.0" y2="153.0" marker-end="url(#sarr)"/>
<line class="wire-a" x1="510.0" y1="153.0" x2="600.0" y2="153.0" marker-end="url(#sarr)"/>
<text class="lbl small mono" x="515.0" y="146.0">ADC_Q2</text>
<rect class="box" x="20.0" y="204.0" width="230.0" height="62.0" rx="6"/>
<text class="lbl strong" x="135.0" y="224.0" text-anchor="middle">quadrant 3 : 16 capteurs DRV5053OA</text>
<text class="lbl small" x="135.0" y="239.0" text-anchor="middle">4 rangées de 4, un P-FET chacune</text>
<text class="lbl small" x="135.0" y="254.0" text-anchor="middle">sortie analogique, 3,3 V, masse</text>
<rect class="box" x="330.0" y="212.0" width="180.0" height="46.0" rx="6"/>
<text class="lbl strong" x="420.0" y="231.5" text-anchor="middle">CD74HC4067</text>
<text class="lbl small" x="420.0" y="246.5" text-anchor="middle">16 vers 1</text>
<line class="wire-a" x1="250.0" y1="235.0" x2="330.0" y2="235.0" marker-end="url(#sarr)"/>
<line class="wire-a" x1="510.0" y1="235.0" x2="600.0" y2="235.0" marker-end="url(#sarr)"/>
<text class="lbl small mono" x="515.0" y="228.0">ADC_Q3</text>
<rect class="box" x="20.0" y="286.0" width="230.0" height="62.0" rx="6"/>
<text class="lbl strong" x="135.0" y="306.0" text-anchor="middle">quadrant 4 : 16 capteurs DRV5053OA</text>
<text class="lbl small" x="135.0" y="321.0" text-anchor="middle">4 rangées de 4, un P-FET chacune</text>
<text class="lbl small" x="135.0" y="336.0" text-anchor="middle">sortie analogique, 3,3 V, masse</text>
<rect class="box" x="330.0" y="294.0" width="180.0" height="46.0" rx="6"/>
<text class="lbl strong" x="420.0" y="313.5" text-anchor="middle">CD74HC4067</text>
<text class="lbl small" x="420.0" y="328.5" text-anchor="middle">16 vers 1</text>
<line class="wire-a" x1="250.0" y1="317.0" x2="330.0" y2="317.0" marker-end="url(#sarr)"/>
<line class="wire-a" x1="510.0" y1="317.0" x2="600.0" y2="317.0" marker-end="url(#sarr)"/>
<text class="lbl small mono" x="515.0" y="310.0">ADC_Q4</text>
<rect class="box-mcu" x="600.0" y="60.0" width="180.0" height="230.0" rx="6"/>
<text class="lbl strong" x="690.0" y="126.5" text-anchor="middle">ESP32-S3-WROOM-1</text>
<text class="lbl small" x="690.0" y="141.5" text-anchor="middle">ADC1, 12 bits</text>
<text class="lbl small" x="690.0" y="156.5" text-anchor="middle">8 lectures par case</text>
<text class="lbl small" x="690.0" y="171.5" text-anchor="middle"></text>
<text class="lbl small" x="690.0" y="186.5" text-anchor="middle">hallscan.c :</text>
<text class="lbl small" x="690.0" y="201.5" text-anchor="middle">ligne de base par case,</text>
<text class="lbl small" x="690.0" y="216.5" text-anchor="middle">seuil et hystérésis,</text>
<text class="lbl small" x="690.0" y="231.5" text-anchor="middle">anti-rebond</text>
<path class="wire-p" d="M600 310 H420 V 265" marker-end="url(#sarr)"/>
<text class="lbl small" x="430.0" y="330.0">MUX_S0..S3 : adresse commune aux 4 multiplexeurs</text>
<path class="wire" d="M600 350 H135 V 368" marker-end="url(#sarr)"/>
<text class="lbl small" x="145.0" y="388.0">ROW_EN0..3 : une rangée alimentée à la fois (courant moyen divisé par 4)</text>
<line class="wire" x1="780.0" y1="175.0" x2="850.0" y2="175.0" marker-end="url(#sarr)"/>
<rect class="box" x="850.0" y="150.0" width="100.0" height="50.0" rx="6"/>
<text class="lbl strong" x="900.0" y="171.5" text-anchor="middle">console</text>
<text class="lbl small" x="900.0" y="186.5" text-anchor="middle">115200 bauds</text>
<text class="lbl mono" x="850.0" y="222.0">B,........</text>
<text class="lbl small muted" x="850.0" y="238.0">à chaque changement</text>
<text class="lbl" x="600.0" y="318.0"></text>
<text class="lbl strong" x="20.0" y="412.0">un scan : 82 µs par case, 1,7 ms par plateau, 584 fois par seconde</text>
</svg>
