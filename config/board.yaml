    antenna:                   # one loop per square, under the piece, on the PCB
      side_ratio: 0.70         # x p, square loop
      turns: 2
      track_mm: 1.0
      gap_mm: 0.5
      q_target: 20.0           # bandwidth for the 848 kHz subcarrier
    tag:                       # round sticker in the base, under the piece coil
      part: NTAG213
      order_key: NTAG213_25mm  # round sticker, docs/prix-hall.csv
      d_out_mm: 25.0
      d_in_mm: 19.0
      turns: 7
      c_in_pF: 50.0
      height_in_base_mm: 0.0
    reader_candidates: [MFRC522, PN5180]
  mockup:                      # the Hall + RFID test board of note 25, all ordered from
                               # JLCPCB. Lengths named *_ratio scale with the pitch; the
                               # stack (gap), the height limit under the plywood
                               # (plateau.quadrant) and the ISO fields (nfc) are read from
                               # their own sections, never repeated here
    columns: [A, B]            # 2 x 2 squares: loops by column, readers by row
    rows: [1, 2]
    board:
      strip_mm: 45.0           # electronics strip past row 2, provisional until lot 5
      rail_mm: 5.0             # assembly rails on the two long sides (Standard PCBA)
      edge_clearance_mm: 3.0   # parts to the edge of the useful board
      fiducial_edge_mm: 3.35   # fiducial centre to the board edge, at least
      fiducials: 3             # on the rails, three corners (Standard PCBA)
      fiducial_d_mm: 1.0       # copper dot
      fiducial_mask_d_mm: 2.0  # solder mask opening around it
      hole_d_mm: 3.2           # M3 clearance, non plated, at the play-area corners
      copper_um: 35.0          # 1 oz outer layers
      eps_r: 4.4               # FR-4 laminate around 10 MHz, the tag panel's too
      standoff_mm: 30.0        # bench standoffs that keep the board away from metal (Q11)
    ground_keepout_mm: 4.0     # D12: no ground copper nearer a loop than this
    ground_keepout_min_mm: 2.0 # the p = 40 variant, to be justified by M13
    loops:                     # square loops on the top copper, crossover bridge on the back
      L60x3: { side_ratio: 0.60, turns: 3, track_mm: 1.0, gap_mm: 0.5 }
      L70x2: { side_ratio: 0.70, turns: 2, track_mm: 1.0, gap_mm: 0.5 }
    loop_by_column: { A: L60x3, B: L70x2 }   # D5
    reader:
      part: MFRC522
      package: HVQFN-32
      footprint_square_mm: 8.0 # free square the 5 x 5 QFN and its pin fan-out need
      by_row:                  # D4: the reference on row 1, the clone on row 2
        1: { maker: NXP, mpn: "MFRC52202HN1,151", lcsc: C11322 }
        2: { maker: JSMSEMI, mpn: MFRC522, lcsc: C2760772 }
      area_mm2: [300.0, 450.0] # a reader with its crystal, filter, network and receive parts
