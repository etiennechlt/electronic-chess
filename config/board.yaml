# Single source of truth for every project constant.
#
# Only independent parameters live here. Derived quantities (resonant
# frequencies, mm diameters, gantry travels, total gap, autonomy) are
# computed by chessboard_calc and pinned by unit tests against the
# specification. No value is duplicated between this file and the code.
schema_version: 1

pitch:
  candidates_mm: [40, 50]      # both still computed and reported for comparison
  mockup_mm: 50                # fixed by the 100x100 mm PCB price tier
  plateau_mm: 50               # decided for the 8x8 board (ADR 0010): signal and Q

pieces:
  classes:                     # base_ratio: base diameter as a fraction of p
    pawn:   { base_ratio: 0.35, cap_nF: { white: 3.9, black: 12.0 } }
    knight: { base_ratio: 0.40, cap_nF: { white: 3.3, black: 10.0 } }
    bishop: { base_ratio: 0.40, cap_nF: { white: 2.7, black: 8.2 } }
    rook:   { base_ratio: 0.45, cap_nF: { white: 2.2, black: 6.8 } }
    queen:  { base_ratio: 0.45, cap_nF: { white: 1.8, black: 5.6 } }
    king:   { base_ratio: 0.45, cap_nF: { white: 1.5, black: 4.7 } }
  spare_queens_per_side: 1     # promotion hardware (critical review, F)
  mass_g: [20, 40]

corridor:
  tolerance_budget_mm: 0.8     # gantry +-0.5 plus base eccentricity +-0.3

resonator:
  L_target_uH: 45.0
  L_tol_pct: 5.0               # hand-wound spread
  C_tol_pct: 1.0               # C0G 1 %
  q_nominal: 50
  q_min_with_magnet: 30        # acceptance floor of measurement 2
  # Acceptance for check_separation. Exact computation puts the worst
  # adjacent pair (3.3 / 3.9 nF, an E12 ratio-1.18 step) at 2.50 widths
  # for Q = 30, so the gate sits just below to catch real regressions
  # without tripping on the nominal design itself.
  min_separation_widths: 2.4
  # Worst-case frequency gap once both neighbors drift by the full
  # component tolerance; must stay well above the ~1 kHz measurement
  # resolution. Nominal design gives 7.1 kHz on the 12 / 10 nF pair.
  min_tolerance_gap_khz: 4.0
  coil:
    outer_margin_mm: 4.0       # d_out = base - 4
    inner_ratio: 0.40          # d_in = 0.40 * d_out, to confirm on mockup
    height_mm: 2.0
    wire_candidates_mm: [0.15, 0.20, 0.25, 0.315]
    insulation_extra_mm: 0.05  # enamel build on top of copper diameter
    fill_factor: 0.70          # round enameled wire, hand-wound
    proximity_factor: 2.5      # crude AC resistance multiplier, mockup calibrates

piece_magnet:
  material: "SrFe hard ferrite"
  br_T: 0.40
  outer_margin_mm: 5.0         # d = base - 5
  thickness_mm: 4.0

gap:                           # nominal total is derived: 1.6 + 2.0 + 3.0 + 0.5 = 7.1
  pcb_mm: 1.6
  air_mm: 2.0                  # clearance under the plywood: LED bodies and the
                               # quadrant front-end strip (ADR 0010, parts <= 1.8 mm)
  surface_mm: 3.0              # dry plywood (was acrylic); thickness is the
                               # only surface parameter that affects the signal
  felt_mm: 0.5
  max_total_mm: 8.0

sense_coil:
  outer_ratio: 0.80            # x p
  inner_ratio: 0.45            # x p
  layers: 4                    # all four layers in series
  L_target_uH: 18.0            # keeps SRF with ~40 pF mux 10x above band
  track_gap_mm: 0.15
  via_drill_mm: 0.30
  copper_um: 35                # 1 oz outer and inner copper
  # track width is derived: turns solved for L_target, spread over annulus

mux:
  part: ADG708
  ron_ohm: 4.0
  c_off_pF: 40.0
  idle_coil_policy: shorted    # both ends grounded (critical review, J)

measurement:
  band_hz: [200.0e+3, 650.0e+3]
  blanking_us: 2.0
  window_us: 128.0
  adc_sps: 4.0e+6
  fft_points: 512
  coherent_avg: 16
  idle_scan_hz: 5
  preamp_gain: [200, 500]
  bandpass_order: 4
  crosstalk_max_db: -20.0
  snr_min_db: 20.0
  preamp_noise_nv_rthz: 4.0    # input-referred amplifier noise density
  drive:                       # excitation model for signal estimates
    v: 12.0
    pulse_us: 1.0
    current_limit_a: 2.0
    excitation_efficiency: 0.5 # derates the ideal flux-transfer estimate

gantry:
  kinematics: corexy
  capture_band_ratio: 1.0      # width of each lateral capture band, x p
  y_margin_mm: 20.0            # travels derive: x = 10 p, y = 8 p + 20
  speed_mm_s: [60, 120]
  accel_mm_s2: [200, 500]
  settle_ms: 50
  driver: { part: TMC2209, mode: stealthchop, disable_at_idle: true }
  per_pitch:                   # discrete choices that do not scale continuously
    40: { motor: NEMA14, guide: "8 mm rods or MGN9" }
    50: { motor: NEMA17, guide: "MGN9 400 + 500" }
  homing: park_against_endstops  # re-zero at every park (critical review, H)

carriage:
  magnet: { material: "NdFeB N42", d_mm: 15.0, h_mm: 5.0 }
  engage_gap_mm: 6.0
  retract_gap_mm: 15.0
  actuator_candidates: [servo_permanent_magnet, electromagnet]  # open (brief 5.3)

friction:
  mu_felt_acrylic: 0.30
  lateral_fraction: [0.20, 0.30]

power:
  battery:
    layout: 3S1P
    cell: "pouch LiPo 1S 5 Ah, 110 x 65 x 8 mm"   # flat cells keep the board 21 mm thin (ADR 0010)
    energy_wh: 55.5            # 3 x 3.7 V x 5 Ah (was 73.4 Wh with 3S2P 18650)
    usable_fraction: 0.80      # implicit in the brief's 65 h claim, now explicit
    v_range: [9.0, 12.6]
    ntc_on_pack: true
  buck_5v:
    f_sw_mhz: 2.2
    forced_pwm: true           # PFM light-load bursts would fall in-band (B)
    spread_spectrum: false
    candidates: [LMR33630, TPS62933F]
  loads_w:
    stm32_analog: 0.4
    pi: 1.2
    tft: 1.2
    motors_avg: 0.35           # 7 W at 5 % duty
    motors_peak: 7.0
    ui_idle: 0.05              # buzzer + status LEDs, human vs human mode (G)
  # Fixed conversion overhead: forced-PWM buck no-load loss, BMS and
  # gauge quiescent. Reconciles the brief's 0.9 W idle total, whose own
  # line items only sum to 0.5 W.
  fixed_overhead_w: 0.35
  regulation_loss_pct: 15
  move_reserve_pct: 10         # refuse to start a move below this SoC
  pi_link: { isolator: ADuM1201, load_switch: true }

mcu: { part: STM32G474RE, sysclk_mhz: 170, mounting: soldered }  # LQFP64 on the brain board, SWD header (ADR 0010)

mockup:
  # 2 x 2 mockup, phase 1. Two boards (ADR 0008): a script-generated
  # 4-layer coil board and a Nucleo-shield analog board, joined edge to
  # edge by a rigid 1x10 header. Pitch is pitch.mockup_mm.
  test_pieces:  # deliberately the bottom of the band, tightest spacing
    - { piece: pawn, color: black }
    - { piece: knight, color: black }
    - { piece: bishop, color: black }
    - { piece: rook, color: black }
  coil_board:
    size_mm: [100.0, 100.0]
    layers: 4
    coil_grid: 2                 # 2 x 2 squares
    track_clearance_mm: 0.13   # JLC 4-layer floor; spiral turn gap is 0.15
    edge_clearance_mm: 0.5
    mounting_hole_d_mm: 3.2
    mounting_hole_inset_mm: 5.0
    magnet_mount:                # under square 1, adjustable bracket
      square: [0, 0]
      hole_spacing_mm: 34.0     # 30 would drill into the spiral outer turn
      hole_d_mm: 3.2
    joint:                       # to the analog board, north edge
      pins: 12                   # GND A1 B1 A3 B3 A4 B4 A2 B2 GND DIN 5V
      pitch_mm: 2.54
      pad_d_mm: 1.7
      drill_mm: 1.0
    route_track_mm: 0.5          # coil-to-connector interconnect width
    leds:                        # camp indicator, ADR 0009
      part: WS2812B              # 5050, official KiCad symbol+footprint pair
      per_square: 2              # two opposite corners (NW and SE)
      corner_inset_mm: 4.5       # LED center from both edges of its square
      light_hole_d_mm: 2.5       # light dots drilled in the wooden surface
      decoupling_nf: 100
      chain_track_mm: 0.3
      ring_track_mm: 1.0
      color_white: [255, 170, 60]  # warm white camp
      color_black: [40, 60, 255]   # cool blue camp
      chain_squares: [2, 2, 4, 4, 3, 3, 1, 1]  # data order along the chain
  analog_board:
    size_mm: [100.0, 56.0]
    layers: 2
    format: nucleo64_shield      # Arduino R3 header pattern, Nucleo below
  analog:
    # Coils are biased at vref_v, not mid-rail: keeps the amplified
    # output inside the 3.3 V MCU range, the AD8421 above its minimum
    # input common mode, and lets the P-FET damp switches (gates pulled
    # to VIN, hard off) turn on with a 3.3 V MCU driving low.
    vref_v: 1.65
    mux: { part: 74HCT4052PW, ron_ohm: 70.0, note: "dual 4:1 diff, TTL thresholds" }
    clamp_r_ohm: 330.0           # series R before mux, BAV99 clamps to rails
    bleed_r_ohm: 10.0e+3         # DC reference on both coil ends, to vref
    ina: { part: AD8421ARZ, gain: 20.0, rg_ohm: 523.0 }
    input_ac_nF: 100.0
    input_bias_r_ohm: 100.0e+3   # to the vref reference
    filter:                      # Sallen-Key equal-component, order 4 total
      hp_hz: 200.0e+3
      lp_hz: 650.0e+3
      q: 0.7071                  # per stage gain K = 3 - 1/Q = 1.586
      output_gain: 4.53          # last op amp; compensates the mid-band sag
                                 # of the 200-650 kHz bandpass: ~200 at 400 kHz
      opamp: OPA2810IDR          # 105 MHz duals: HP, LP, vref buffer, output
    adc_rc: { r_ohm: 49.9, c_nF: 1.0 }
  drive:                         # per-coil excitation, bypasses the mux
    rail_fet: AO3401A            # one shared high-side switch from 12 V
    rail_r_ohm: 10.0             # shared series power resistor, 2512
    bus_diode: B5819W            # per coil, isolates coils from the bus at rest
    coil_fet: AO3400A            # per coil low-side drive switch
    clamp_diode: SS34            # per coil flyback clamp back to the 12 V rail
    damp_fet: AO3401A            # per coil P-FET damp switch, active low
    damp_r_ohm: 680.0            # near-critical damping of the parasitic ring;
                                 # 0 ohm variant turns it into the idle short
  power:
    input: { v_nom: 12.0, jack: "5.5 x 2.1 mm", tvs: SMBJ15A, reverse_diode: SS54 }
    buck: { part: TPS62913RPUR, f_sw_mhz: 2.2, l_uH: 2.2, vout: 5.0, forced_pwm: true }
    ldo: { part: TPS7A4901DGNR, vout: 5.0 }
    analog_source_jumper: [buck_filtered, ldo]   # the measurement-8 A/B test
    pi_header: { pins: 4, rail: buck_5v }
  uart_isolator: { part: ADuM1201ARZ, bypass_jumpers: true }
  nucleo_pins:                   # Nucleo-G474RE Arduino connector mapping
    amp_out: { arduino: A0, mcu: PA0 }    # ADC1_IN1
    comp_in: { arduino: A1, mcu: PA1 }    # COMP1_INP
    pulse_en: { arduino: A2, mcu: PA4 }
    mux_a0: { arduino: D3, mcu: PB3 }
    mux_a1: { arduino: D4, mcu: PB5 }
    mux_inh: { arduino: D5, mcu: PB4 }  # 4052 Inh, active high
    damp_1: { arduino: D6, mcu: PB10 }
    damp_2: { arduino: D7, mcu: PA8 }
    damp_3: { arduino: D9, mcu: PC7 }
    damp_4: { arduino: D10, mcu: PB6 }
    drive_1: { arduino: D11, mcu: PA7 }
    drive_2: { arduino: D12, mcu: PA6 }
    drive_3: { arduino: D14, mcu: PB9 }
    drive_4: { arduino: D15, mcu: PB8 }
    led_din: { arduino: D13, mcu: PA5 }   # TIM2_CH1, WS2812 via PWM DMA
    pi_uart_tx: { arduino: D8, mcu: PA9 }   # USART1, through the isolator
    pi_uart_rx: { arduino: D2, mcu: PA10 }
    # CSV output uses the Nucleo virtual COM port (USART2 PA2/PA3)

plateau:                       # 8x8 board built directly from 4x4 quadrants (ADR 0010)
  grid: 8
  quadrant:
    squares: 4                 # 4 x 4 coils per quadrant, 4 identical boards
    layers: 4
    mux: ADG1607               # two dual 8:1 muxes, outputs paralleled, one enable each
                               # (ADG726 has no verified symbol in the KiCad 7 libraries)
    front_end_strip_mm: 20.0   # analog front end on the top side, outer x edge
    front_end_max_height_mm: 1.8   # must fit under the plywood in gap.air_mm
    link:                      # to the brain board, one flat cable each
      connector: "FPC 0.5 mm, 16 broches, 1,4 mm de haut (Hirose FH12-16S-0.5SH)"
      footprint: "Connector_FFC-FPC:Hirose_FH12-16S-0.5SH_1x16-1MP_P0.50mm_Horizontal"
      pins: 16
      # GND, 5V_LED, LED_DIN and LED_DOUT get a dedicated fan-out on the
      # quadrant (bus ties, LED chain): keep them apart, never on adjacent pins
      pinout: [GND, 5VA, GND, AMP_OUT, 3V3, MUX_A0, LED_DIN, MUX_A1,
               MUX_A2, 5V_LED, MUX_EN_L, MUX_EN_H, LED_DOUT, PULSE_EN,
               DAMP_EN_N, VIN]
    routing:                   # quadgen numbers
      track_clearance_mm: 0.15
      edge_clearance_mm: 0.5
      route_track_mm: 0.3      # coil escapes and LED copper
      lane_pitch_mm: 0.45      # route_track + clearance
      ring_track_mm: 1.0       # 5 V and GND distribution
      led_via: { pad_mm: 0.6, drill_mm: 0.3, stub_mm: 1.0 }
      grid_mm: 0.2             # A* raster for the LED chain and spurs
    strip:                     # front-end strip floor plan, y from the north edge
      connector_zone_mm: 25.7  # FPC connector, cable exits west, locating pin hole, rail switch, spare passives
      cell_pitch_mm: 7.4       # one per coil, 8 per band, split around the escape band
      middle_zone_mm: 43.8     # decoders stacked, muxes side by side, amplifier chain (cells are anchored to the bands)
      lane_x0_mm: 1.0          # coil entry lanes down the west edge
      cell_entry_x_mm: 3.8     # A on F.Cu at y - 0.6, B on B.Cu at y + 0.6
    front_end:
      drive_decoder: 74HC4514  # 4 to 16, active high: coil excitation gates, inhibited by PULSE_EN_N
      damp_decoder: 74HC154    # 4 to 16, active low: P-FET damping gates, enabled by DAMP_EN_N
      flyback_diode: "SS34FL, SOD-123FL, 1 mm de haut"
      logic_rail: 3V3          # decoders and inverter; mux, INA and op amps on 5VA
    mounting_hole_d_mm: 3.2
    mounting_hole_inset_mm: 5.0
  leds:
    corners: [NW, SE]          # every square identical, no exception (mockup S2 had one)
  wood:
    border_mm: 20.0            # plywood frame around the play area, covers the strip
  module_underside_clear: true # nothing under the quadrants: the gantry base needs the room
  base:
    shell_mm: 2.0
    electronics_cavity_mm: 12.0   # brain, power board and flat cells, same footprint in both bases
    cell_mm: [110.0, 65.0, 8.0]   # one pouch cell, three side by side
    gantry_cavity_mm: 33.0        # CoreXY layer above the electronics, gantry base only
    locating_pins: { d_mm: 4.0, count: 4 }   # top module to base, sets the carriage reference
    wing_seam_max_mm: 0.3         # wood to capture wing step, pieces slide across on felt
  brain:
    mcu_board: "STM32G474RE soldered, USB, SWD, 4 quadrant IDC, LED chain, 5 V buck forced PWM, 3.3 V, analog LDO island"
    power_board: "3S BMS, USB-C PD charge, gauge"
    motion_board: "2 x TMC2209, endstops, magnet actuator; lives in the gantry base, optional"
    comms: { module: ESP32-S3-WROOM-1, pi_header: true, isolator: ADuM1201, load_switch: true }
    peripheral_port: "USB-C, 5 V + UART, for wired accessories"
    board_mm: [120.0, 80.0]
    layers: 4
    mcu_pins:                  # STM32G474RE, to validate against the datasheet before fab
      ADC1: PA0                # quadrant 1, ADC1_IN1
      ADC2: PA6                # quadrant 2, ADC2_IN3
      ADC3: PB0                # quadrant 3, ADC3_IN12
      ADC4: PB14               # quadrant 4, ADC4_IN4
      LED_DIN_MCU: PA5         # TIM2_CH1, WS2812 chain through the 74AHCT1G125
      MUX_A0: PB3
      MUX_A1: PB5
      MUX_A2: PB4
      MUX_EN_L: PC0
      MUX_EN_H: PC1
      PULSE_EN: PA4
      DAMP_EN_N: PC2
      STEP1: PC6               # TIM3_CH1
      DIR1: PC7
      STEP2: PC8               # TIM3_CH3
      DIR2: PC9
      MOT_EN: PC12
      TMC_TX: PC10             # USART3
      TMC_RX: PC11
      ENDSTOP_X: PD2
      ENDSTOP_Y: PA3
      SERVO: PB6               # TIM4_CH1
      I2C_SCL: PA15            # I2C1, power board AFE and gauge (PB8 is BOOT0)
      I2C_SDA: PB7
      BUZZER: PB10             # TIM2_CH3
      LED_STAT1: PC13
      LED_STAT2: PC14
      LED_STAT3: PC15
      LED_STAT4: PA8
      USER_BTN: PB11
      COMM_EN: PB15            # comms module load switch
      MCU_TX: PA9              # USART1 to the isolated UART
      MCU_RX: PA10
      USB_DM_MCU: PA11
      USB_DP_MCU: PA12
      SWDIO: PA13
      SWCLK: PA14
      CHG_STAT: PA7
      PWR_KEY: PB1
      MOT_ALARM: PB2
      MOT_DIAG: PC4
      ESP_EN: PB12
      ESP_IO0: PB13

clock:                         # separate rocker chess clock, BLE to the board (ADR 0010)
  radio: ble
  mcu: ESP32-S3-WROOM-1       # same module as the brain, one part to stock and one toolchain
  cell: "18650 1S, 3 Ah, USB-C charge"
  body_mm: [120.0, 70.0]
  height_front_mm: 26.0
  height_rear_mm: 36.0
  slope_end_mm: 42.0           # sloped display face from the front edge to here, flat behind
  wall_mm: 2.0
  lid_mm: 2.0
  display: { diagonal_in: 2.4, window_mm: [50.0, 38.0], up_slope_mm: 22.5 }
  rocker:
    length_mm: 108.0
    width_mm: 18.0
    thickness_mm: 8.0
    recess_mm: 5.0
    tilt_deg: 5.0
    pivot_d_mm: 4.0
    switch_inset_mm: 12.0      # microswitch under each end, from the bar end
  encoder: { knob_d_mm: 14.0, x_mm: 104.0, up_slope_mm: 12.0 }
  buzzer_grille: { holes: [3, 3], pitch_mm: 5.0, hole_d_mm: 2.0, origin_mm: [12.0, 8.0] }
  usb_c_slot_mm: [9.2, 3.6]
