      q_loaded: 24.0           # replaces nfc.antenna.q_target for the mockup loops
      l0_nH: 560.0             # EMC filter
      c0_pF: 220.0
      l0_q: 30.0               # filter inductor Q at the carrier
      cap_esr_ohm: 0.03        # C0G 0603 at the carrier
      cap_series: E12          # C1 and C2 are a main value plus a trim, both from it
      cap_tol_pct: 2.0         # C0G, 10 pF and above
      rq_series: E12           # Rq and the receive divider R1
      rx_coupling_nF: 1.0      # series capacitor of the receive divider
      loop_lead_mm: 10.0       # feed leads and back-side bridge of a loop, added to its copper
      tune_tag: P              # tuned with this tag, bare, at the nominal gap (NanoVNA)
      gamma_max: 0.2           # reflection of the normalized network against z_target
    hall:
