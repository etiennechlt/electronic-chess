      r_drive_ohm: 3.0         # per TX pin at full conductance: an assumption, measured in M13
      i_tvdd_max_ma: 100.0     # transmitter supply limit of the datasheet
      i_tvdd_accept_ma: 70.0   # full conductance only once tuned and measured below this
      i_idle_ma: 13.5          # awake, transmitter off
      i_idle_max_ma: 19.0
      rx_max_vpp: 4.0          # RX input limit
      rx_target_vpp: [1.5, 2.0]
      rx_r2_ohm: 1000.0        # RX to VMID, sets the divider level; R1 follows from the target
      r_sense_ohm: 1.0         # in series with TVDD, read with a multimeter
    matching:                  # per side: TX, L0, C0 to ground, C1, C2 to ground, Rq, loop
