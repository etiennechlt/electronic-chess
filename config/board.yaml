      filter_r_ohm: 1000.0     # per sensor output, 1 k near the sensor
      filter_c_nF: 10.0        # and 10 nF at the ADC or mux input
      decoupling_nF: 100.0
      land_mm: 3.6             # SOT-23 land pattern, its longer side, kept inside the opening
      settle_lsb: 0.5          # a reading is valid within this many ADC counts of its final value
      trio_pitch_mm: 0.4       # VCC, OUT, GND traces out of a loop: 0.2 mm track and gap
    mux_channels:              # the CD74HC4067 of the mockup
      centre: [0, 1, 2, 3]     # A1, B1, A2, B2
      cluster: [4, 5, 6, 7]
      ground: 8                # zero of the path
      rail_half: 9             # switched row-1 rail divided by two
      led_step: 10             # LED pin through a divider by two and a known RC
      extension: [11, 12, 13, 14, 15]
    esp32:
