[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessboard-calc"
version = "0.1.0"
description = "Parametric engineering calculations for the LC-sensing automatic chessboard"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools]
packages = ["chessboard_calc", "coilgen", "quadgen"]

[tool.setuptools.package-dir]
coilgen = "tools/coilgen"
quadgen = "tools/quadgen"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]  # vendored third-party skills keep upstream style

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
